name: Real LuCI UI Gate

on:
  pull_request:
    paths:
      - 'package/luci-app-performance-manager/htdocs/**'
      - 'package/luci-app-performance-manager/root/usr/share/luci/**'
      - 'package/luci-app-performance-manager/root/usr/share/rpcd/**'
      - 'package/luci-app-performance-manager/po/**'
      - 'package/performance-manager/files/**'
      - 'tests/real-luci-ui*'
      - '.github/workflows/real-luci-ui.yml'
  workflow_dispatch:
    inputs:
      language:
        description: LuCI language for the full screenshot matrix
        required: true
        type: choice
        options: [en, zh_cn]
        default: en

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-luci-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Start a real OpenWrt and LuCI container
        run: |
          set -euo pipefail
          docker run -d --name pm-ui-gate --network host --cap-add=NET_ADMIN \
            openwrt/rootfs:x86_64-24.10.8 /sbin/init
          for _ in $(seq 1 30); do
            docker exec pm-ui-gate true 2>/dev/null && exit 0
            sleep 2
          done
          echo 'OpenWrt container did not start' >&2
          exit 1
      - name: Install real LuCI and Performance Manager runtime dependencies
        run: |
          set -euo pipefail
          docker exec pm-ui-gate sh -c '
            opkg update
            opkg install bash jq curl luci-base luci-theme-bootstrap luci-i18n-base-zh-cn \
              uhttpd rpcd ucode ucode-mod-fs ucode-mod-ubus ucode-mod-uci ucode-mod-rtnl \
              ucode-mod-uloop ucode-mod-socket ucode-mod-log coreutils-timeout openssl-util
            for command in bash jq curl ucode ubus openssl; do command -v "$command" >/dev/null; done
          '
      - name: Compile Simplified Chinese LuCI catalog
        if: ${{ inputs.language == 'zh_cn' }}
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/luci-po2lmo"
          mkdir -p "$source_dir"
          curl -fL --retry 3 -o "$RUNNER_TEMP/luci-openwrt-24.10.tar.gz" https://codeload.github.com/openwrt/luci/tar.gz/aa4865e8e6472d6ba68e541688065fc2235bbd83
          tar -xzf "$RUNNER_TEMP/luci-openwrt-24.10.tar.gz" -C "$source_dir" --strip-components=1
          make -C "$source_dir/modules/luci-base/src" po2lmo
          "$source_dir/modules/luci-base/src/po2lmo" \
            "$GITHUB_WORKSPACE/package/luci-app-performance-manager/po/zh_Hans/performance-manager.po" \
            "$RUNNER_TEMP/performance-manager.zh-cn.lmo"
          test -s "$RUNNER_TEMP/performance-manager.zh-cn.lmo"
          echo "PM_UI_LMO=$RUNNER_TEMP/performance-manager.zh-cn.lmo" >> "$GITHUB_ENV"
      - name: Provision current source into real LuCI
        run: PM_UI_LANG='${{ inputs.language || 'en' }}' bash tests/real-luci-ui-provision.sh pm-ui-gate 18080
      - name: Install Playwright and locate Chrome
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/ui" --no-audit --no-fund playwright@1.55.0
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$browser" || { echo 'No Chrome executable on runner' >&2; exit 1; }
          echo "PLAYWRIGHT_EXECUTABLE=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Install checksum-pinned Aurora theme
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/luci-theme-aurora.ipk" https://github.com/eamonxg/luci-theme-aurora/releases/download/v1.4.0/luci-theme-aurora_1.4.0-r20260920_all.ipk
          echo "5b3f2d669ef82e575498d1b99c4b9b498088540eeff7db989f214b63d3ef8a8e  $RUNNER_TEMP/luci-theme-aurora.ipk" | sha256sum -c -
          docker cp "$RUNNER_TEMP/luci-theme-aurora.ipk" pm-ui-gate:/tmp/luci-theme-aurora.ipk
          docker exec pm-ui-gate opkg install /tmp/luci-theme-aurora.ipk
      - name: Capture all views, themes, and viewport matrix
        run: |
          set -euo pipefail
          language='${{ inputs.language || 'en' }}'
          docker exec pm-ui-gate sh -c "uci set luci.main.lang='$language'; uci commit luci; rm -rf /tmp/luci-indexcache* /tmp/luci-modulecache*"
          NODE_PATH="$RUNNER_TEMP/ui/node_modules" PM_UI_CONTAINER=pm-ui-gate \
            PM_UI_LANG="$language" PM_VISUAL_OUT="$GITHUB_WORKSPACE/real-luci-ui-evidence/visual/$language" \
            node tests/real-luci-ui-visual.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: real-luci-ui-evidence-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: real-luci-ui-evidence/
          if-no-files-found: warn
      - name: Remove disposable OpenWrt container
        if: always()
        run: docker rm -f pm-ui-gate || true
