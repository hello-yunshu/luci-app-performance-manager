name: Portable stable validation matrix

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full PM commit SHA under portable release validation
        required: true
        type: string
      build_run_id:
        description: Same-commit Build OpenWrt run containing exact APKs
        required: true
        type: string
      ci_run_id:
        description: Same-commit CI run containing the exact verified Runtime v3 evidence
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  OPENWRT_VERSION: "25.12.5"
  OPENWRT_TARGET: "x86/64"

jobs:
  portable-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_sha }}

      - name: Verify exact checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"

      - name: Download same-commit build and CI evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p stable-input/build stable-input/ci stable-output
          python3 scripts/verify_action_run_identity.py \
            --run-id "${{ inputs.build_run_id }}" \
            --expected-sha "${{ inputs.expected_sha }}" \
            --expected-workflow 'Build OpenWrt (remote SDK)' \
            --expected-workflow-path '.github/workflows/build-openwrt.yml'
          python3 scripts/verify_action_run_identity.py \
            --run-id "${{ inputs.ci_run_id }}" \
            --expected-sha "${{ inputs.expected_sha }}" \
            --expected-workflow 'CI' \
            --expected-workflow-path '.github/workflows/ci.yml'
          gh run download "${{ inputs.build_run_id }}" --dir stable-input/build
          gh run download "${{ inputs.ci_run_id }}" --dir stable-input/ci

      - name: Run repository tests in hosted runner
        shell: bash
        run: |
          set -euo pipefail
          if python3 -m unittest discover -s tests -p 'test_*.py' > stable-output/unit-tests.log 2>&1; then
            python3 -c 'import json, re; log=open("stable-output/unit-tests.log").read(); count=int(re.search(r"Ran (\\d+) tests?", log).group(1)); json.dump({"verdict":"PASS","testCount":count,"command":"python3 -m unittest discover -s tests -p test_*.py"}, open("stable-output/test-report.json", "w"), indent=2)'
          else
            python3 -c 'import json; json.dump({"verdict":"FAIL","command":"python3 -m unittest discover -s tests -p test_*.py"}, open("stable-output/test-report.json", "w"), indent=2)'
            exit 1
          fi

      - name: Run real Core ucode harness inside Docker
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/docker-validate/harness/build-harness.py "$RUNNER_TEMP/core_runtime_test.uc"
          base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}"
          rootfs="openwrt-${OPENWRT_VERSION}-x86-64-rootfs.tar.gz"
          curl -fsSL "$base/sha256sums" -o "$RUNNER_TEMP/openwrt-sha256sums"
          rootfs_sha=$(awk -v f="*$rootfs" '$2 == f {print $1}' "$RUNNER_TEMP/openwrt-sha256sums")
          [[ "$rootfs_sha" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/openwrt-cache" .portable-rootfs
          archive="$RUNNER_TEMP/openwrt-cache/$rootfs"
          if [ ! -f "$archive" ]; then
            curl -fsSL "$base/$rootfs" -o "$archive"
          fi
          printf '%s *%s\n' "$rootfs_sha" "$archive" | sha256sum -c -
          sudo tar -xzf "$archive" -C .portable-rootfs
          sudo rm -f .portable-rootfs/etc/resolv.conf
          sudo cp /etc/resolv.conf .portable-rootfs/etc/resolv.conf
          if sudo chroot .portable-rootfs /bin/sh -c 'command -v apk >/dev/null 2>&1'; then
            sudo chroot .portable-rootfs /bin/sh -c 'apk update --no-check-certificate && apk add --no-check-certificate ucode ucode-mod-fs ucode-mod-ubus ucode-mod-uci ucode-mod-rtnl ucode-mod-uloop ucode-mod-socket ucode-mod-log'
          else
            sudo chroot .portable-rootfs /bin/sh -c 'opkg update && opkg install ucode ucode-mod-fs ucode-mod-ubus ucode-mod-uci ucode-mod-rtnl ucode-mod-uloop ucode-mod-socket ucode-mod-log'
          fi
          sudo install -D -m 0644 \
            package/performance-manager/files/usr/share/performance-manager/contracts.uc \
            .portable-rootfs/usr/share/performance-manager/contracts.uc
          # tar/chroot preparation runs as root; Docker's context sender runs
          # as the hosted runner and must be able to read every rootfs entry.
          sudo chown -R "$(id -u):$(id -g)" .portable-rootfs
          docker build --file tools/docker-validate/Dockerfile.local --tag pm-portable-ucode:ci . > stable-output/docker-build.log 2>&1
          docker run --rm \
            --volume "$RUNNER_TEMP/core_runtime_test.uc:/tmp/core_runtime_test.uc:ro" \
            --entrypoint /usr/bin/ucode \
            pm-portable-ucode:ci /tmp/core_runtime_test.uc 2>&1 | tee stable-output/docker-runtime.log
          printf '\nPORTABLE_DOCKER_PASS\n' >> stable-output/docker-runtime.log

      - name: Show Docker build log after failure
        if: failure()
        shell: bash
        run: |
          if [ -f stable-output/docker-build.log ]; then
            echo "::group::Docker build log from failed fast build"
            cat stable-output/docker-build.log
            echo "::endgroup::"
          fi

      - name: Build portable release evidence
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t build_files < <(find stable-input/build -name build-metadata.json -type f -print)
          mapfile -t apk_files < <(find stable-input/build -name apk-verification.json -type f -print)
          test "${#build_files[@]}" = 2
          test "${#apk_files[@]}" = 2
          selected_build=$(find stable-input/build -type f -path '*x86-64-64-x86_64-packages-and-evidence/build-metadata.json' -print -quit)
          selected_apk=$(find stable-input/build -type f -path '*x86-64-64-x86_64-packages-and-evidence/apk-verification.json' -print -quit)
          test -n "$selected_build"
          test -n "$selected_apk"
          selected_root="$RUNNER_TEMP/portable-x86-build"
          mkdir -p "$selected_root"
          cp -a "$(dirname "$selected_build")/." "$selected_root/"
          python3 scripts/portable_docker_gate.py \
            --expected-commit "${{ inputs.expected_sha }}" \
            --build-root "$selected_root" \
            --ci-root stable-input/ci \
            --docker-log stable-output/docker-runtime.log \
            --test-report stable-output/test-report.json \
            --out stable-output/portable-docker.json

      - name: Upload portable evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stable-portable-docker
          path: stable-output
          if-no-files-found: error
