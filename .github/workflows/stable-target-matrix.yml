name: Portable validation matrix

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full PM commit SHA under portable validation
        required: true
        type: string
      build_run_id:
        description: Same-commit Build OpenWrt run containing exact APKs
        required: true
        type: string
      ci_run_id:
        description: Same-commit CI run containing the exact verified Runtime v3 evidence
        required: true
        type: string
  workflow_run:
    workflows: ["Build OpenWrt (remote SDK)"]
    types: [completed]

permissions:
  actions: read
  contents: read

env:
  OPENWRT_VERSION: "25.12.6"
  OPENWRT_TARGET: "x86/64"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    # Automatic promotion stays bound to the exact pushed commit: it only runs
    # for a successful main-branch Build and reuses that run plus the matching
    # successful CI run. Manual dispatch keeps supplying all three identities.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      expected_sha: ${{ steps.identity.outputs.expected_sha }}
      build_run_id: ${{ steps.identity.outputs.build_run_id }}
      ci_run_id: ${{ steps.identity.outputs.ci_run_id }}
    steps:
      - name: Resolve same-commit CI and Build runs
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sha='${{ github.event.inputs.expected_sha }}'
            build='${{ github.event.inputs.build_run_id }}'
            ci='${{ github.event.inputs.ci_run_id }}'
          else
            sha='${{ github.event.workflow_run.head_sha }}'
            build='${{ github.event.workflow_run.id }}'
            ci=''
            for _ in $(seq 1 20); do
              picked=$(gh run list --workflow ci.yml --branch main --commit "$sha" --limit 20 \
                --json databaseId,status,conclusion \
                --jq '.[] | select(.status == "completed") | "\(.databaseId) \(.conclusion)"' | head -1)
              if [ -n "$picked" ]; then
                if [ "${picked##* }" = success ]; then ci=${picked%% *}; fi
                break
              fi
              sleep 30
            done
            if [ -z "$ci" ]; then
              echo "no successful same-commit CI run for $sha" >&2
              exit 1
            fi
          fi
          printf 'expected_sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'build_run_id=%s\n' "$build" >> "$GITHUB_OUTPUT"
          printf 'ci_run_id=%s\n' "$ci" >> "$GITHUB_OUTPUT"

  portable-docker:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.expected_sha }}

      - name: Verify exact checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ needs.resolve.outputs.expected_sha }}"

      - name: Download same-commit build and CI evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p stable-input/build stable-input/ci stable-output
          python3 scripts/verify_action_run_identity.py \
            --run-id "${{ needs.resolve.outputs.build_run_id }}" \
            --expected-sha "${{ needs.resolve.outputs.expected_sha }}" \
            --expected-workflow 'Build OpenWrt (remote SDK)' \
            --expected-workflow-path '.github/workflows/build-openwrt.yml'
          python3 scripts/verify_action_run_identity.py \
            --run-id "${{ needs.resolve.outputs.ci_run_id }}" \
            --expected-sha "${{ needs.resolve.outputs.expected_sha }}" \
            --expected-workflow 'CI' \
            --expected-workflow-path '.github/workflows/ci.yml'
          gh run download "${{ needs.resolve.outputs.build_run_id }}" --dir stable-input/build
          gh run download "${{ needs.resolve.outputs.ci_run_id }}" --dir stable-input/ci

      - name: Run repository tests in hosted runner
        shell: bash
        run: |
          set -euo pipefail
          if python3 -m unittest discover -s tests -p 'test_*.py' > stable-output/unit-tests.log 2>&1; then
            python3 -c 'import json, re; log=open("stable-output/unit-tests.log").read(); count=int(re.search(r"Ran (\d+) tests?", log).group(1)); json.dump({"verdict":"PASS","testCount":count,"command":"python3 -m unittest discover -s tests -p test_*.py"}, open("stable-output/test-report.json", "w"), indent=2)'
          else
            python3 -c 'import json; json.dump({"verdict":"FAIL","command":"python3 -m unittest discover -s tests -p test_*.py"}, open("stable-output/test-report.json", "w"), indent=2)'
            exit 1
          fi

      - name: Run real Core ucode harness inside Docker
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/docker-validate/harness/build-harness.py "$RUNNER_TEMP/core_runtime_test.uc"
          base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}"
          rootfs="openwrt-${OPENWRT_VERSION}-x86-64-rootfs.tar.gz"
          curl -fsSL "$base/sha256sums" -o "$RUNNER_TEMP/openwrt-sha256sums"
          rootfs_sha=$(awk -v f="*$rootfs" '$2 == f {print $1}' "$RUNNER_TEMP/openwrt-sha256sums")
          [[ "$rootfs_sha" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/openwrt-cache" .portable-rootfs
          archive="$RUNNER_TEMP/openwrt-cache/$rootfs"
          if [ ! -f "$archive" ]; then
            curl -fsSL "$base/$rootfs" -o "$archive"
          fi
          printf '%s *%s\n' "$rootfs_sha" "$archive" | sha256sum -c -
          sudo tar -xzf "$archive" -C .portable-rootfs
          sudo rm -f .portable-rootfs/etc/resolv.conf
          sudo cp /etc/resolv.conf .portable-rootfs/etc/resolv.conf
          # The pristine rootfs ships an empty /dev. TLS fetches from inside
          # the chroot (apk-mbedtls / uclient-fetch) need an entropy source
          # and fail every index with "wgetSSL error: ERROR - Generic error"
          # when /dev/urandom is missing. Provide standard device nodes for
          # the chroot phase only; they are removed again before the rootfs
          # is copied into the Docker build context below.
          sudo mknod -m 0666 .portable-rootfs/dev/null c 1 3
          sudo mknod -m 0666 .portable-rootfs/dev/zero c 1 5
          sudo mknod -m 0666 .portable-rootfs/dev/random c 1 8
          sudo mknod -m 0666 .portable-rootfs/dev/urandom c 1 9
          # Repo index fetches can still transiently fail from the hosted
          # runner (mirrors truncate packages.adb); retry without changing
          # what is installed or where it comes from.
          if sudo chroot .portable-rootfs /bin/sh -c 'command -v apk >/dev/null 2>&1'; then
            for attempt in 1 2 3 4 5; do
              if sudo chroot .portable-rootfs /bin/sh -c 'apk update && apk add ca-bundle ucode ucode-mod-fs ucode-mod-ubus ucode-mod-uci ucode-mod-rtnl ucode-mod-uloop ucode-mod-socket ucode-mod-log'; then break; fi
              if [ "$attempt" = 5 ]; then exit 1; fi
              sleep 15
            done
          else
            for attempt in 1 2 3 4 5; do
              if sudo chroot .portable-rootfs /bin/sh -c 'opkg update && opkg install ucode ucode-mod-fs ucode-mod-ubus ucode-mod-uci ucode-mod-rtnl ucode-mod-uloop ucode-mod-socket ucode-mod-log'; then break; fi
              if [ "$attempt" = 5 ]; then exit 1; fi
              sleep 15
            done
          fi
          # Keep special files out of the Docker build context; the
          # container runtime provides /dev at run time.
          sudo rm -f .portable-rootfs/dev/null .portable-rootfs/dev/zero .portable-rootfs/dev/random .portable-rootfs/dev/urandom
          sudo rm -rf .portable-core-rootfs
          sudo mkdir -p .portable-core-rootfs
          sudo tar -cf - -C .portable-rootfs . | sudo tar -xf - -C .portable-core-rootfs
          sudo install -D -m 0644 \
            package/performance-manager/files/usr/share/performance-manager/contracts.uc \
            .portable-core-rootfs/usr/share/performance-manager/contracts.uc
          # tar/chroot preparation runs as root; Docker's context sender runs
          # as the hosted runner and must be able to read every rootfs entry.
          sudo chown -R "$(id -u):$(id -g)" .portable-rootfs .portable-core-rootfs
          docker build --file tools/docker-validate/Dockerfile.local --tag pm-portable-ucode:ci . > stable-output/docker-build.log 2>&1
          docker run --rm \
            --volume "$RUNNER_TEMP/core_runtime_test.uc:/tmp/core_runtime_test.uc:ro" \
            --entrypoint /usr/bin/ucode \
            pm-portable-ucode:ci /tmp/core_runtime_test.uc 2>&1 | tee stable-output/docker-runtime.log
          printf '\nPORTABLE_DOCKER_PASS\n' >> stable-output/docker-runtime.log

      - name: Show Docker build log after failure
        if: failure()
        shell: bash
        run: |
          if [ -f stable-output/docker-build.log ]; then
            echo "::group::Docker build log from failed fast build"
            cat stable-output/docker-build.log
            echo "::endgroup::"
          fi

      - name: Build portable release evidence
        shell: bash
        run: |
          set -euo pipefail
          selected_build=$(find stable-input/build -type f -path '*x86-64-x86_64-packages-and-evidence/build-metadata.json' -print -quit)
          selected_apk=$(find stable-input/build -type f -path '*x86-64-x86_64-packages-and-evidence/docs/apk-verification.json' -print -quit)
          test -n "$selected_build"
          test -n "$selected_apk"
          selected_root="$RUNNER_TEMP/portable-x86-build"
          mkdir -p "$selected_root"
          cp -a "$(dirname "$selected_build")/." "$selected_root/"
          sudo python3 scripts/package_composition_gate.py \
            --rootfs .portable-rootfs \
            --packages "$selected_root" \
            --expected-commit "${{ needs.resolve.outputs.expected_sha }}" \
            --openwrt-version "$OPENWRT_VERSION" \
            --target "$OPENWRT_TARGET" \
            --package-arch x86_64 \
            --out stable-output/package-composition.json
          python3 scripts/portable_docker_gate.py \
            --expected-commit "${{ needs.resolve.outputs.expected_sha }}" \
            --build-root "$selected_root" \
            --ci-root stable-input/ci \
            --docker-log stable-output/docker-runtime.log \
            --test-report stable-output/test-report.json \
            --package-report stable-output/package-composition.json \
            --out stable-output/portable-docker.json

      - name: Upload portable evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portable-docker-validation
          path: stable-output
          if-no-files-found: error
