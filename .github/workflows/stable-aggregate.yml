name: Stable evidence aggregate

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full final PM commit SHA
        required: true
        type: string
      ci_run_id:
        description: Successful same-commit CI run ID
        required: true
        type: string
      build_run_id:
        description: Successful same-commit Build OpenWrt run ID
        required: true
        type: string
      target_run_id:
        description: Successful same-commit Portable stable validation matrix run ID
        required: true
        type: string
      profile:
        description: Release evidence profile
        required: true
        default: portable-docker
        type: string

permissions:
  actions: read
  contents: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_sha }}
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
      - name: Download all three same-commit evidence runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/ci evidence/build evidence/target
          python3 scripts/verify_action_run_identity.py --run-id "${{ inputs.ci_run_id }}" --expected-sha "${{ inputs.expected_sha }}" --expected-workflow 'CI' --expected-workflow-path '.github/workflows/ci.yml'
          python3 scripts/verify_action_run_identity.py --run-id "${{ inputs.build_run_id }}" --expected-sha "${{ inputs.expected_sha }}" --expected-workflow 'Build OpenWrt (remote SDK)' --expected-workflow-path '.github/workflows/build-openwrt.yml'
          python3 scripts/verify_action_run_identity.py --run-id "${{ inputs.target_run_id }}" --expected-sha "${{ inputs.expected_sha }}" --expected-workflow 'Portable stable validation matrix' --expected-workflow-path '.github/workflows/stable-target-matrix.yml'
          gh run download "${{ inputs.ci_run_id }}" --dir evidence/ci
          gh run download "${{ inputs.build_run_id }}" --dir evidence/build
          gh run download "${{ inputs.target_run_id }}" --dir evidence/target
      - name: Collect and aggregate without promotion shortcuts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/collect_stable_evidence.py \
            --ci-root evidence/ci --build-root evidence/build --target-root evidence/target \
            --out stable-evidence --profile "${{ inputs.profile }}"
          python3 scripts/final_release_audit.py \
            --evidence-dir stable-evidence \
            --expected-commit "${{ inputs.expected_sha }}" \
            --profile "${{ inputs.profile }}"
          cp docs/FINAL_AUDIT.json stable-evidence/
          cp docs/FINAL_AUDIT.md stable-evidence/
      - name: Upload authoritative Stable evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: final-stable-evidence-${{ inputs.expected_sha }}
          path: |
            stable-evidence/final-stable-evidence.json
            stable-evidence/FINAL_AUDIT.json
            stable-evidence/FINAL_AUDIT.md
          if-no-files-found: error
