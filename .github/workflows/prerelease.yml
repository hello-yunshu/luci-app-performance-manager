name: Publish immutable prerelease

on:
  workflow_run:
    workflows: ["Build OpenWrt (remote SDK)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full PM commit SHA built by the official SDK workflow
        required: true
        type: string
      build_run_id:
        description: Successful same-commit Build OpenWrt run ID
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_commit.message, 'release: publish prerelease'))
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.event.workflow_run.head_sha }}
      BUILD_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.build_run_id || github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
      - name: Verify source and build run identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          python3 scripts/verify_action_run_identity.py \
            --run-id "$BUILD_RUN_ID" \
            --expected-sha "$EXPECTED_SHA" \
            --expected-workflow 'Build OpenWrt (remote SDK)' --expected-workflow-path '.github/workflows/build-openwrt.yml'
      - name: Download same-commit SDK artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-input release-assets
          gh run download "$BUILD_RUN_ID" --dir release-input
      - name: Verify and assemble the single-APK release inventory
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$EXPECTED_SHA")
          export SOURCE_DATE_EPOCH
          python3 scripts/make_release.py
          python3 scripts/assemble_prerelease.py \
            --input release-input \
            --out release-assets \
            --expected-sha "$EXPECTED_SHA" \
            --source-dist dist \
            --version "$(cat VERSION)"
      - name: Refuse an existing prerelease identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(cat VERSION)"
          test -z "$(git ls-remote --tags origin "refs/tags/$tag")"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists; refusing overwrite" >&2
            exit 1
          fi
      - name: Create immutable tag and prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          tag="v$version"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" "$EXPECTED_SHA" -m "OpenWrt Performance Manager $version"
          git push origin "refs/tags/$tag"
          python3 - "$version" <<'PY'
          import pathlib, sys
          version=sys.argv[1]
          lines=pathlib.Path('CHANGELOG.md').read_text().splitlines()
          start=next(i for i,line in enumerate(lines) if line.startswith(f'## {version} '))
          end=next((i for i in range(start+1,len(lines)) if lines[i].startswith('## ')),len(lines))
          pathlib.Path('release-notes.md').write_text('\n'.join(lines[start+1:end]).strip()+'\n')
          PY
          gh release create "$tag" release-assets/* \
            --verify-tag --prerelease \
            --title "OpenWrt Performance Manager $version · all-in-one APK" \
            --notes-file release-notes.md
      - name: Re-download and verify published assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir published
          gh release download "v$(cat VERSION)" --dir published
          (cd published && sha256sum -c release-checksums.txt)
