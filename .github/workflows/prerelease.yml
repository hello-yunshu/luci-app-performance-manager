name: Publish immutable prerelease

on:
  workflow_run:
    workflows: ["Build OpenWrt (remote SDK)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full PM commit SHA built by the official SDK workflow
        required: true
        type: string
      build_run_id:
        description: Successful same-commit Build OpenWrt run ID
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_commit.message, 'release: publish prerelease'))
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.event.workflow_run.head_sha }}
      BUILD_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.build_run_id || github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
      - name: Verify source and build run identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          python3 scripts/verify_action_run_identity.py \
            --run-id "$BUILD_RUN_ID" \
            --expected-sha "$EXPECTED_SHA" \
            --expected-workflow 'Build OpenWrt (remote SDK)' --expected-workflow-path '.github/workflows/build-openwrt.yml'
      - name: Download same-commit SDK artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-input release-public release-evidence
          gh run download "$BUILD_RUN_ID" --dir release-input
      - name: Verify and assemble the IPK/APK release inventory
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$EXPECTED_SHA")
          export SOURCE_DATE_EPOCH
          python3 scripts/make_release.py
          python3 scripts/assemble_prerelease.py \
            --input release-input \
            --out release-public \
            --expected-sha "$EXPECTED_SHA" \
            --version "$(cat VERSION)"
          python3 scripts/verify_public_release_assets.py \
            --assets release-public --version "$(cat VERSION)"
      - name: Refuse an existing prerelease identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(cat VERSION)"
          test -z "$(git ls-remote --tags origin "refs/tags/$tag")"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists; refusing overwrite" >&2
            exit 1
          fi
      - name: Create immutable tag and prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          tag="v$version"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" "$EXPECTED_SHA" -m "OpenWrt Performance Manager $version"
          git push origin "refs/tags/$tag"
          python3 - "$version" <<'PY'
          import json, pathlib, sys
          version=sys.argv[1]
          targets=json.loads(pathlib.Path('contracts/openwrt-native-targets.json').read_text())['targets']
          lines='\n'.join(f"- OpenWrt {t['openwrtVersion']} / {t['packageArch']} ({t['packageManagerFormat']}): `performance-manager-all-v{version}-openwrt-{t['openwrtVersion']}-{t['packageArch']}.{t['packageManagerFormat']}`" for t in targets)
          pathlib.Path('release-notes.md').write_text(f'''## 下载\n\n统一 PM 包包含 Performance Manager Core、LuCI、简体中文、Rill glue 和 Runtime 兼容清单。`rill-runtime-manager` 与共享 `rill-runtime` 由 feed 提供；请通过 LuCI 的 Rill 页面安装或更新 Runtime。包冲突时不会自动卸载旧 split 或 Stable 包。\n\n{lines}\n\n当前状态：Portable validated；Hardware Stable not yet qualified。\n''')
          PY
          gh release create "$tag" release-public/* \
            --verify-tag --prerelease \
            --title "OpenWrt Performance Manager $version" \
            --notes-file release-notes.md
      - name: Re-download and verify published assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir published
          gh release download "v$(cat VERSION)" --dir published
          (cd published && sha256sum -c SHA256SUMS.txt)
          python3 scripts/verify_public_release_assets.py --assets published --version "$(cat VERSION)"
