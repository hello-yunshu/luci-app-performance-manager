name: Publish immutable Stable release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full final PM commit SHA
        required: true
        type: string
      aggregate_run_id:
        description: Successful Stable evidence aggregate run ID
        required: true
        type: string
      build_run_id:
        description: Successful same-commit Build OpenWrt run ID
        required: true
        type: string
      profile:
        description: Authorized release evidence profile (auto runs read it from the evidence)
        required: false
        default: ""
        type: string
  workflow_run:
    workflows: ["Stable evidence aggregate"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      expected_sha: ${{ steps.identity.outputs.expected_sha }}
      aggregate_run_id: ${{ steps.identity.outputs.aggregate_run_id }}
      build_run_id: ${{ steps.identity.outputs.build_run_id }}
      requested_profile: ${{ steps.identity.outputs.requested_profile }}
    steps:
      - name: Resolve same-commit aggregate and Build runs
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sha='${{ github.event.inputs.expected_sha }}'
            aggregate='${{ github.event.inputs.aggregate_run_id }}'
            build='${{ github.event.inputs.build_run_id }}'
            profile='${{ github.event.inputs.profile }}'
          else
            sha='${{ github.event.workflow_run.head_sha }}'
            aggregate='${{ github.event.workflow_run.id }}'
            profile=''
            build=''
            for _ in $(seq 1 20); do
              picked=$(gh run list --workflow build-openwrt.yml --branch main --commit "$sha" --limit 20 \
                --json databaseId,status,conclusion \
                --jq '.[] | select(.status == "completed") | "\(.databaseId) \(.conclusion)"' | head -1)
              if [ -n "$picked" ]; then
                if [ "${picked##* }" = success ]; then build=${picked%% *}; fi
                break
              fi
              sleep 30
            done
            if [ -z "$build" ]; then
              echo "no successful same-commit Build run for $sha" >&2
              exit 1
            fi
          fi
          {
            printf 'expected_sha=%s\n' "$sha"
            printf 'aggregate_run_id=%s\n' "$aggregate"
            printf 'build_run_id=%s\n' "$build"
          } >> "$GITHUB_OUTPUT"
          printf 'requested_profile=%s\n' "$profile" >> "$GITHUB_OUTPUT"

  gate:
    # A repeated push without a version bump must not fail the chain: an already
    # public release is left untouched instead of being re-mutated.
    needs: resolve
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.expected_sha }}
      - name: Skip when this version is already published
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(cat VERSION)"
          if gh release view "$tag" >/dev/null 2>&1 && \
             [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = false ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already public; nothing to publish"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: [resolve, gate]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: stable-release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.expected_sha }}
          fetch-depth: 0
      - name: Verify run and repository identities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.resolve.outputs.expected_sha }}"
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          for makefile in package/*/Makefile; do
            grep -Fq "PM_VERSION_FILE:=\$(firstword \$(wildcard \$(PM_PACKAGE_DIR)VERSION" "$makefile" || {
              echo "$makefile does not derive PKG_VERSION from VERSION" >&2
              exit 1
            }
          done
          python3 scripts/verify_action_run_identity.py --run-id '${{ needs.resolve.outputs.aggregate_run_id }}' --expected-sha '${{ needs.resolve.outputs.expected_sha }}' --expected-workflow 'Stable evidence aggregate' --expected-workflow-path '.github/workflows/stable-aggregate.yml'
          python3 scripts/verify_action_run_identity.py --run-id '${{ needs.resolve.outputs.build_run_id }}' --expected-sha '${{ needs.resolve.outputs.expected_sha }}' --expected-workflow 'Build OpenWrt (remote SDK)' --expected-workflow-path '.github/workflows/build-openwrt.yml'
      - name: Download exact build and final Stable evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-input/build release-input/stable release-public release-evidence
          gh run download "${{ needs.resolve.outputs.build_run_id }}" --dir release-input/build
          gh run download "${{ needs.resolve.outputs.aggregate_run_id }}" --dir release-input/stable
          mapfile -t evidence_files < <(find release-input/stable -name final-stable-evidence.json -type f -print)
          test "${#evidence_files[@]}" = 1
          evidence="${evidence_files[0]}"
          profile=$(python3 - "$evidence" "${{ needs.resolve.outputs.expected_sha }}" "${{ needs.resolve.outputs.requested_profile }}" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1]))
          requested=sys.argv[3]
          assert data['overallVerdict']=='PASS' and data['stableReleaseVerdict']=='PASS' and data['stableReleaseAuthorized'] is True, data
          assert data['releaseProfile'] in ('hardware', 'portable-docker'), data
          if requested:
              # A manual dispatch may narrow the expectation, never widen it.
              assert data['releaseProfile']==requested, data
          if data['releaseProfile']=='hardware':
              assert data['hardwareCoverage']=='PASS', data
          else:
              # Portable evidence authorizes the release but never claims
              # hardware proof; the notes disclose the narrower coverage.
              assert data['hardwareCoverage']=='NOT_EVALUATED', data
          assert data['pmCommitSha']==sys.argv[2], data
          print(data['releaseProfile'])
          PY
          )
          echo "RELEASE_PROFILE=$profile" >> "$GITHUB_ENV"
      - name: Prove source ZIP reproducibility from tracked files
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct '${{ needs.resolve.outputs.expected_sha }}')
          export SOURCE_DATE_EPOCH
          python3 scripts/make_release.py
          first=''
          first=$(sha256sum "dist/openwrt-performance-manager-$(cat VERSION).zip" | awk '{print $1}')
          cp "dist/openwrt-performance-manager-$(cat VERSION).zip" /tmp/source-first.zip
          python3 scripts/make_release.py
          second=$(sha256sum "dist/openwrt-performance-manager-$(cat VERSION).zip" | awk '{print $1}')
          test "$first" = "$second"
          cmp /tmp/source-first.zip "dist/openwrt-performance-manager-$(cat VERSION).zip"
      - name: Assemble exact public inventory and private evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/assemble_public_release.py \
            --input release-input/build --out release-public \
            --expected-commit '${{ needs.resolve.outputs.expected_sha }}' --version "$(cat VERSION)"
          for name in final-stable-evidence.json FINAL_AUDIT.json FINAL_AUDIT.md; do
            mapfile -t files < <(find release-input/stable -name "$name" -type f -print)
            test "${#files[@]}" = 1
            file="${files[0]}"
            cp "$file" release-evidence/
          done
          cp "dist/openwrt-performance-manager-$(cat VERSION).zip" release-evidence/
          cp "dist/openwrt-performance-manager-$(cat VERSION).manifest.json" release-evidence/source-manifest.json
          python3 scripts/build_release_manifest.py --assets release-public \
              --input release-input/build --evidence-dir release-evidence \
              --expected-commit '${{ needs.resolve.outputs.expected_sha }}' --version "$(cat VERSION)"
          python3 scripts/verify_public_release_assets.py \
            --assets release-public --version "$(cat VERSION)"
          python3 - "$RELEASE_PROFILE" '${{ needs.resolve.outputs.expected_sha }}' <<'PY'
          import json, pathlib, sys
          profile, sha = sys.argv[1], sys.argv[2]
          version = pathlib.Path('VERSION').read_text().strip()
          targets = json.loads(pathlib.Path('contracts/openwrt-native-targets.json').read_text())['targets']
          versions = sorted({t['openwrtVersion'] for t in targets})
          rows = '\n'.join(
              f"| {t['openwrtVersion']} | {t['packageArch']} | {t['packageManagerFormat']} | "
              f"`performance-manager-all-v{version}-openwrt-{t['openwrtVersion']}-{t['packageArch']}.{t['packageManagerFormat']}` |"
              for t in targets)
          pathlib.Path('release-title.txt').write_text(
              f"Performance Manager v{version} · OpenWrt {' / '.join(versions)}\n")
          if profile == 'hardware':
              coverage = ('发布依据：hardware 档位全部 gate PASS（hardwareCoverage = PASS）。\n'
                          '- 覆盖真实设备、NIC、Hyper-V/KVM、LAN-WAN、sysupgrade、reboot 与 12h soak。')
          else:
              coverage = ('发布依据：hosted runner 的 portable 档位证据（profile = portable-docker）。\n'
                          '- 已覆盖：真实 Core ucode harness、package composition（split 与 all-in-one 的安装/升级/卸载）、仓库测试、Docker 内服务与 ubus/Rill smoke。\n'
                          '- 未覆盖：real NIC、Hyper-V/KVM、LAN-WAN、sysupgrade、reboot 与 12h soak；hardwareCoverage = NOT_EVALUATED。')
          body = '\n'.join([
              f"## Performance Manager v{version}",
              "",
              "一个安装包包含 PM Core、LuCI 界面、简体中文、Rill glue 与 Runtime 兼容清单。`rill-runtime-manager` 与共享 `rill-runtime` 由 feed 提供，首次使用前请在 LuCI 的 Rill 页面安装或更新 Runtime。",
              "",
              "### 兼容目标",
              "",
              "| OpenWrt | 架构 | 格式 | 资产 |",
              "| --- | --- | --- | --- |",
              rows,
              "",
              "### 安装",
              "",
              "- OpenWrt 25.12+（apk）：`apk add --allow-untrusted <资产>`",
              "- OpenWrt 24.10（opkg）：`opkg install <资产>`",
              "- 与旧 split 包或旧 Stable 包冲突时不会自动卸载，请先手动卸载旧包。",
              "",
              "### 验证范围",
              "",
              coverage,
              "",
              "### 可追溯性",
              "",
              f"- 提交：`{sha}`",
              "- 所有资产来自同一提交的构建，校验见 `SHA256SUMS.txt`。",
              "- Runtime provenance 与完整证据保留在 GitHub Actions。",
              "",
          ])
          pathlib.Path('release-notes.md').write_text(body)
          PY
      - name: Verify or create immutable tag identity and resumable draft
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          tag="v$version"
          remote_tag=$(git ls-remote --tags origin "refs/tags/${tag}^{}" | awk '{print $1}')
          if [ -n "$remote_tag" ]; then
            test "$remote_tag" = "${{ needs.resolve.outputs.expected_sha }}" || {
              echo "$tag exists at $remote_tag, expected ${{ needs.resolve.outputs.expected_sha }}" >&2
              exit 1
            }
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag" "${{ needs.resolve.outputs.expected_sha }}" -m "Performance Manager $tag"
            git push origin "refs/tags/$tag"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true || {
              echo "$tag release exists and is public; refusing mutation" >&2
              exit 1
            }
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Create or resume draft GitHub Release, then publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-public/* --clobber
          else
            gh release create "$tag" release-public/* --draft --verify-tag \
              --title "$(cat release-title.txt)" \
              --notes-file release-notes.md
          fi
          gh release edit "$tag" --draft=false --title "$(cat release-title.txt)" \
            --notes-file release-notes.md
      - name: Re-download published assets and verify checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir published
          gh release download "v$(cat VERSION)" --dir published
          (cd published && sha256sum -c SHA256SUMS.txt)
          python3 scripts/verify_public_release_assets.py --assets published --version "$(cat VERSION)"
      - name: Trigger unified feed refresh
        env:
          GH_TOKEN: ${{ secrets.FEED_DISPATCH_TOKEN }}
          SOURCE: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(cat VERSION)"
          if [ -z "${GH_TOKEN}" ]; then
            echo "::notice::未配置 FEED_DISPATCH_TOKEN，跳过 yun-openwrt-packages 刷新"
            exit 0
          fi
          payload="$(jq -nc --arg source "${SOURCE}" --arg tag "${tag}" \
            '{event_type: "upstream-release", client_payload: {source: $source, tag: $tag}}')"
          # A re-run after this version was published cannot retry this step, so
          # absorb transient API/network failures here instead of dropping the
          # notification for the whole release.
          attempt=1
          until printf '%s' "${payload}" | gh api -X POST repos/hello-yunshu/yun-openwrt-packages/dispatches --input -; do
            if [ "${attempt}" -ge 3 ]; then
              echo "::error::通知 yun-openwrt-packages 失败（已重试 3 次）" >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep $((attempt * 5))
          done
          echo "已通知 yun-openwrt-packages 刷新（${tag}）"
