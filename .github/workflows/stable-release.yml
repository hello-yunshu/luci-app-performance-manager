name: Publish immutable Stable release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full final PM commit SHA
        required: true
        type: string
      aggregate_run_id:
        description: Successful Stable evidence aggregate run ID
        required: true
        type: string
      build_run_id:
        description: Successful same-commit Build OpenWrt run ID
        required: true
        type: string
      profile:
        description: Authorized release evidence profile
        required: true
        default: portable-docker
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: stable-release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - name: Verify run and repository identities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          for makefile in package/*/Makefile; do
            package_version=$(sed -n 's/^PKG_VERSION:=//p' "$makefile")
            test "$package_version" = "$version" || {
              echo "$makefile has version $package_version, expected $version" >&2
              exit 1
            }
          done
          python3 scripts/verify_action_run_identity.py --run-id '${{ inputs.aggregate_run_id }}' --expected-sha '${{ inputs.expected_sha }}' --expected-workflow 'Stable evidence aggregate' --expected-workflow-path '.github/workflows/stable-aggregate.yml'
          python3 scripts/verify_action_run_identity.py --run-id '${{ inputs.build_run_id }}' --expected-sha '${{ inputs.expected_sha }}' --expected-workflow 'Build OpenWrt (remote SDK)' --expected-workflow-path '.github/workflows/build-openwrt.yml'
      - name: Download exact build and final Stable evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-input/build release-input/stable release-assets
          gh run download "${{ inputs.build_run_id }}" --dir release-input/build
          gh run download "${{ inputs.aggregate_run_id }}" --dir release-input/stable
          mapfile -t evidence_files < <(find release-input/stable -name final-stable-evidence.json -type f -print)
          test "${#evidence_files[@]}" = 1
          evidence="${evidence_files[0]}"
          python3 - "$evidence" "${{ inputs.expected_sha }}" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1]))
          assert data['overallVerdict']=='PASS' and data['stableReleaseAuthorized'] is True, data
          assert data['releaseProfile']=='${{ inputs.profile }}', data
          assert data['hardwareCoverage']=='NOT_EVALUATED' if '${{ inputs.profile }}' == 'portable-docker' else True, data
          assert data['pmCommitSha']==sys.argv[2], data
          PY
      - name: Prove source ZIP reproducibility from tracked files
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct '${{ inputs.expected_sha }}')
          export SOURCE_DATE_EPOCH
          python3 scripts/make_release.py
          first=''
          first=$(sha256sum "dist/openwrt-performance-manager-$(cat VERSION).zip" | awk '{print $1}')
          cp "dist/openwrt-performance-manager-$(cat VERSION).zip" /tmp/source-first.zip
          python3 scripts/make_release.py
          second=$(sha256sum "dist/openwrt-performance-manager-$(cat VERSION).zip" | awk '{print $1}')
          test "$first" = "$second"
          cmp /tmp/source-first.zip "dist/openwrt-performance-manager-$(cat VERSION).zip"
      - name: Assemble exact release inventory and manifest
        shell: bash
        run: |
          set -euo pipefail
          # The shared resolver accepts identical dedicated/full copies and
          # rejects conflicting identities before staging the all-in-one and
          # integration APKs. The generic Runtime package is external.
          python3 scripts/assemble_public_release.py \
            --input release-input/build --out release-assets \
            --expected-commit '${{ inputs.expected_sha }}'
          for name in final-stable-evidence.json FINAL_AUDIT.json FINAL_AUDIT.md; do
            mapfile -t files < <(find release-input/stable -name "$name" -type f -print)
            test "${#files[@]}" = 1
            file="${files[0]}"
            cp "$file" release-assets/
          done
          cp "dist/openwrt-performance-manager-$(cat VERSION).zip" release-assets/
          cp "dist/openwrt-performance-manager-$(cat VERSION).manifest.json" release-assets/source-manifest.json
          python3 scripts/build_release_manifest.py --assets release-assets \
              --expected-commit '${{ inputs.expected_sha }}' --version "$(cat VERSION)"
          (cd release-assets && sha256sum ./* > release-checksums.txt)
      - name: Verify or create immutable tag identity and resumable draft
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          tag="v$version"
          remote_tag=$(git ls-remote --tags origin "refs/tags/${tag}^{}" | awk '{print $1}')
          if [ -n "$remote_tag" ]; then
            test "$remote_tag" = "${{ inputs.expected_sha }}" || {
              echo "$tag exists at $remote_tag, expected ${{ inputs.expected_sha }}" >&2
              exit 1
            }
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag" "${{ inputs.expected_sha }}" -m "OpenWrt Performance Manager $tag"
            git push origin "refs/tags/$tag"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true || {
              echo "$tag release exists and is public; refusing mutation" >&2
              exit 1
            }
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Create or resume draft GitHub Release, then publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* --draft --verify-tag \
              --title "OpenWrt Performance Manager $tag (Docker-verified)" \
              --notes-file release-assets/FINAL_AUDIT.md
          fi
          gh release edit "$tag" --draft=false --title "OpenWrt Performance Manager $tag (Docker-verified)" \
            --notes-file release-assets/FINAL_AUDIT.md
      - name: Re-download published assets and verify checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir published
          gh release download "v$(cat VERSION)" --dir published
          (cd published && sha256sum -c release-checksums.txt)
