name: Sync qualified Rill Runtime

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [rill-runtime-qualified]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: hello-yunshu/rill-openwrt-packages
          ref: main
          path: rill-openwrt-packages
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Resolve latest qualified Stable 1.x
        run: python3 scripts/check_rill_dependency.py --sync --package-dir rill-openwrt-packages
      - name: Open update pull request
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- contracts/rill-runtime.json; then
            echo 'No new qualified Stable 1.x Runtime is available.'
            exit 0
          fi
          version=$(python3 -c 'import json; print(json.load(open("contracts/rill-runtime.json"))["resolved"]["version"])')
          branch="chore/rill-${version}"
          git switch -c "$branch"
          git add contracts/rill-runtime.json
          git commit -m "deps(rill): update runtime to v${version}"
          git push origin "HEAD:${branch}"
          gh pr create --base main --head "$branch" --title "deps(rill): update runtime to v${version}" --body "Updates the single immutable Rill Runtime contract after the matching rill-openwrt-packages qualification passed. The required consumer integration workflow must pass before merge."
