name: Sync qualified Rill Runtime

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [rill-runtime-qualified]

permissions:
  contents: read
  pull-requests: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: hello-yunshu/rill-openwrt-packages
          ref: main
          path: rill-openwrt-packages
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Resolve latest qualified Stable 1.x
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_rill_dependency.py --sync --package-dir rill-openwrt-packages
      - name: Verify no contract drift
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- contracts/rill-runtime.json; then
            echo 'No new qualified Stable 1.x Runtime is available.'
            exit 0
          fi
          echo '::error::Qualified Runtime drift detected; automatic branch/PR creation is disabled.'
          git diff -- contracts/rill-runtime.json
          exit 1
