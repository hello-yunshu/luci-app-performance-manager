name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_VERSION: "25.12.5"
  OPENWRT_TARGET: "x86/64"

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check jsonschema pyyaml
      - run: make audit
      - name: LuCI JavaScript syntax + render smoke
        shell: bash
        run: |
          set -euo pipefail
          for f in package/luci-app-performance-manager/htdocs/luci-static/resources/performance-manager/*.js \
                   package/luci-app-performance-manager/htdocs/luci-static/resources/view/performance-manager/*.js; do
            { echo '(function(){'; cat "$f"; echo '})();'; } > /tmp/luci-check.js
            node --check /tmp/luci-check.js
          done
          # Runtime render harness (not just syntax): catches Blocker-1 style
          # temporal-dead-zone crashes in the LuCI benchmark view.
          node scripts/luci_render_smoke.js
      - name: Python companion syntax
        run: python -m py_compile companion/pm_companion_agent.py
      - name: Upload source/behavior audit evidence
        uses: actions/upload-artifact@v7
        with:
          name: source-audit-evidence
          path: |
            docs/FINAL_AUDIT.md
            docs/FINAL_AUDIT.json
            docs/source-audit.json
            docs/SOURCE_GATES.json
            docs/HOST_SYNTAX_REPORT.json
            docs/RESOURCE_BUDGET.json
          if-no-files-found: error

  # The PM-owned adapter is built from the exact crates.io rill-ml v1.5.3
  # dependency in this repository. The immutable v1.5.1 upstream fixture is
  # retained only for compatibility and source-history verification.
  pm-rill-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: x86_64-unknown-linux-musl
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check pyyaml jsonschema pynacl
      - name: Verify PM-owned adapter static dependency/protocol contract
        run: python scripts/rill_contract_check.py
      - name: Verify immutable historical RillML v1.5.1 fixture
        run: python scripts/verify_historical_rill_release.py
      - name: Build PM-owned adapter and stage exact target artifact
        run: |
          python scripts/build_pm_adapter.py --target x86_64-unknown-linux-musl
          mkdir -p docs
          cp package/performance-manager-rill-adapter/files/usr/sbin/performance-manager-rill-adapter docs/performance-manager-rill-adapter-x86_64-unknown-linux-musl
          python scripts/build_pm_provenance.py
      - name: Run pm-rill-shadow v1 wire harness (fail-closed decision table)
        run: python scripts/rill_runtime_harness.py
      - name: Generate Rill consumed manifest
        run: python scripts/generate_rill_consumed_manifest.py --out rill-consumed-manifest.json
      - name: Upload Rill provenance + verified adapter artifact
        uses: actions/upload-artifact@v7
        with:
          name: rill-provenance
          path: |
            docs/rill-provenance.json
            docs/rill-integration-status.json
            docs/rill-wire-harness.json
            docs/performance-manager-rill-adapter-x86_64-unknown-linux-musl
            rill-consumed-manifest.json
          if-no-files-found: error

  # Real PM-owned adapter execution inside the official OpenWrt rootfs.
  # Consumes the EXACT verified contract-selected x86_64-musl PM adapter from provenance,
  # executes it (--version -> 1.0.3), starts it and drives the real
  # pm-rill-shadow v1 status/observe/outcome roundtrips plus fail-closed
  # negatives through scripts/rill_adapter_runtime.py. No mock, no Core mirror.
  pm-rill-runtime:
    runs-on: ubuntu-latest
    needs: pm-rill-provenance
    steps:
      - uses: actions/checkout@v7
      - name: Download verified adapter artifact from provenance
        uses: actions/download-artifact@v8
        with:
          name: rill-provenance
          path: rill-evidence
      - name: Resolve consumed adapter path from manifest
        shell: bash
        run: |
          set -euo pipefail
          ADAPTER_NAME="$(python3 - <<'PY'
          import json
          with open("rill-evidence/rill-consumed-manifest.json", encoding="utf-8") as handle:
              print(json.load(handle)["artifactName"])
          PY
          )"
          ADAPTER_PATH="rill-evidence/docs/${ADAPTER_NAME}"
          test -f "$ADAPTER_PATH"
          printf 'ADAPTER_PATH=%s\n' "$ADAPTER_PATH" >> "$GITHUB_ENV"
      - name: Resolve official OpenWrt rootfs identity
        id: openwrt-rootfs
        shell: bash
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}"
          rootfs="openwrt-${OPENWRT_VERSION}-x86-64-rootfs.tar.gz"
          curl -fsSL "$base/sha256sums" -o "$RUNNER_TEMP/openwrt-sha256sums"
          rootfs_sha=$(awk -v f="*$rootfs" '$2 == f {print $1}' "$RUNNER_TEMP/openwrt-sha256sums")
          [[ "$rootfs_sha" =~ ^[0-9a-f]{64}$ ]]
          echo "filename=$rootfs" >> "$GITHUB_OUTPUT"
          echo "sha256=$rootfs_sha" >> "$GITHUB_OUTPUT"
          echo "OPENWRT_ROOTFS=$rootfs" >> "$GITHUB_ENV"
          echo "OPENWRT_ROOTFS_SHA256=$rootfs_sha" >> "$GITHUB_ENV"
      - name: Restore verified OpenWrt rootfs archive
        uses: actions/cache@v6
        with:
          path: .cache/openwrt/${{ steps.openwrt-rootfs.outputs.filename }}
          key: openwrt-rootfs-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENWRT_VERSION }}-${{ steps.openwrt-rootfs.outputs.sha256 }}
      - name: Set up official OpenWrt rootfs (musl x86_64)
        shell: bash
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}"
          archive=".cache/openwrt/$OPENWRT_ROOTFS"
          mkdir -p "$(dirname "$archive")"
          if [ ! -f "$archive" ]; then
            curl -fsSL "$base/$OPENWRT_ROOTFS" -o "$archive"
          fi
          printf '%s *%s\n' "$OPENWRT_ROOTFS_SHA256" "$archive" | sha256sum -c -
          mkdir rootfs
          sudo tar -xzf "$archive" -C rootfs
          sudo rm -f rootfs/etc/resolv.conf
          sudo cp /etc/resolv.conf rootfs/etc/resolv.conf
      - name: Install schema validator for the protocol client
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Execute PM-owned adapter + real protocol roundtrip
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$ADAPTER_PATH"
          sudo install -D -m 0755 "$ADAPTER_PATH" rootfs/usr/sbin/performance-manager-rill-adapter
          sudo mkdir -p rootfs/run/performance-manager rootfs/etc/performance-manager/rill
          # Start the EXACT PM-owned adapter inside the musl rootfs.
          sudo nohup chroot rootfs /usr/sbin/performance-manager-rill-adapter --socket /run/performance-manager/rill.sock --state-dir /etc/performance-manager/rill --max-message 65536 --timeout-ms 1000 >/dev/null 2>&1 &
          trap 'sudo pkill -f "performance-manager-rill-adapter.*performance-manager/rill.sock" 2>/dev/null || true' EXIT
          # Wait for the socket.
          for _ in $(seq 1 20); do
            [ -S rootfs/run/performance-manager/rill.sock ] && break
            sleep 0.5
          done
          # Real protocol client against the REAL binary (no mock).
          # The host path to the running socket is rootfs/run/pm-rill.sock.
          sudo python3 scripts/rill_adapter_runtime.py \
            --adapter rootfs/usr/sbin/performance-manager-rill-adapter \
            --socket rootfs/run/performance-manager/rill.sock \
            --state-dir rootfs/etc/performance-manager/rill \
            --out-dir docs
      - name: Upload real adapter runtime + protocol evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rill-runtime-evidence
          path: |
            docs/rill-adapter-version.txt
            docs/rill-adapter-runtime.log
            docs/rill-protocol-roundtrip.json
            docs/rill-runtime.json
          if-no-files-found: error

  # Real shipped PM Core <-> real contract-selected adapter inside the rootfs.
  # Installs the RAW performance-manager.uc + the verified adapter at the shared
  # empty-binary default path, starts ubusd + adapter + Core, then asserts
  # `ubus call performance-manager rill_status` negotiated the real adapter
  # (available, contract RillML/adapter identity, protocol 1, canonical binary).
  pm-core-rill-roundtrip:
    runs-on: ubuntu-latest
    needs: pm-rill-provenance
    steps:
      - uses: actions/checkout@v7
      - name: Download verified adapter artifact from provenance
        uses: actions/download-artifact@v8
        with:
          name: rill-provenance
          path: rill-evidence
      - name: Resolve consumed adapter path from manifest
        shell: bash
        run: |
          set -euo pipefail
          ADAPTER_NAME="$(python3 - <<'PY'
          import json
          with open("rill-evidence/rill-consumed-manifest.json", encoding="utf-8") as handle:
              print(json.load(handle)["artifactName"])
          PY
          )"
          ADAPTER_PATH="rill-evidence/docs/${ADAPTER_NAME}"
          test -f "$ADAPTER_PATH"
          printf 'ADAPTER_PATH=%s\n' "$ADAPTER_PATH" >> "$GITHUB_ENV"
      - name: Resolve official OpenWrt rootfs identity
        id: openwrt-rootfs
        shell: bash
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}"
          rootfs="openwrt-${OPENWRT_VERSION}-x86-64-rootfs.tar.gz"
          curl -fsSL "$base/sha256sums" -o "$RUNNER_TEMP/openwrt-sha256sums"
          rootfs_sha=$(awk -v f="*$rootfs" '$2 == f {print $1}' "$RUNNER_TEMP/openwrt-sha256sums")
          [[ "$rootfs_sha" =~ ^[0-9a-f]{64}$ ]]
          echo "filename=$rootfs" >> "$GITHUB_OUTPUT"
          echo "sha256=$rootfs_sha" >> "$GITHUB_OUTPUT"
          echo "OPENWRT_ROOTFS=$rootfs" >> "$GITHUB_ENV"
          echo "OPENWRT_ROOTFS_SHA256=$rootfs_sha" >> "$GITHUB_ENV"
      - name: Restore verified OpenWrt rootfs archive
        uses: actions/cache@v6
        with:
          path: .cache/openwrt/${{ steps.openwrt-rootfs.outputs.filename }}
          key: openwrt-rootfs-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENWRT_VERSION }}-${{ steps.openwrt-rootfs.outputs.sha256 }}
      - name: Set up official OpenWrt rootfs with ubus + ucode (x86_64)
        shell: bash
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}"
          archive=".cache/openwrt/$OPENWRT_ROOTFS"
          mkdir -p "$(dirname "$archive")"
          if [ ! -f "$archive" ]; then
            curl -fsSL "$base/$OPENWRT_ROOTFS" -o "$archive"
          fi
          printf '%s *%s\n' "$OPENWRT_ROOTFS_SHA256" "$archive" | sha256sum -c -
          mkdir rootfs
          sudo tar -xzf "$archive" -C rootfs
          sudo rm -f rootfs/etc/resolv.conf
          sudo cp /etc/resolv.conf rootfs/etc/resolv.conf
          sudo chroot rootfs /bin/sh -c 'apk update --no-check-certificate && apk add --no-check-certificate ucode ucode-mod-fs ucode-mod-ubus ucode-mod-uci ucode-mod-rtnl ucode-mod-uloop ucode-mod-socket ucode-mod-log' || \
          sudo chroot rootfs /bin/sh -c 'opkg update && opkg install ucode ucode-mod-fs ucode-mod-ubus ucode-mod-uci ucode-mod-rtnl ucode-mod-uloop ucode-mod-socket ucode-mod-log'
      - name: Real Core <-> PM-owned adapter roundtrip
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$ADAPTER_PATH"
          sudo python3 scripts/rill_core_roundtrip.py "$PWD/rootfs" "$PWD/$ADAPTER_PATH"
      - name: Verify roundtrip evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_WORKSPACE" <<'PY'
          import json, sys
          ev = json.load(open(f"{sys.argv[1]}/docs/pm-core-rill-roundtrip.json"))
          if ev.get("verdict") != "PASS":
              print(f"FAIL: pm-core-rill-roundtrip verdict={ev.get('verdict')}: {ev.get('checks')}")
              sys.exit(1)
          print(f"pm-core-rill-roundtrip: PASS state={ev['checks']}")
          PY
      - name: Upload real Core<->adapter roundtrip evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pm-core-rill-roundtrip
          path: |
            pm-core-rill-roundtrip.log
            docs/pm-core-rill-roundtrip.json
            docs/rill-core-integration.json
          if-no-files-found: error

  openwrt-ucode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve official OpenWrt rootfs identity
        id: openwrt-rootfs
        shell: bash
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}"
          rootfs="openwrt-${OPENWRT_VERSION}-x86-64-rootfs.tar.gz"
          curl -fsSL "$base/sha256sums" -o "$RUNNER_TEMP/openwrt-sha256sums"
          rootfs_sha=$(awk -v f="*$rootfs" '$2 == f {print $1}' "$RUNNER_TEMP/openwrt-sha256sums")
          [[ "$rootfs_sha" =~ ^[0-9a-f]{64}$ ]]
          echo "filename=$rootfs" >> "$GITHUB_OUTPUT"
          echo "sha256=$rootfs_sha" >> "$GITHUB_OUTPUT"
          echo "OPENWRT_ROOTFS=$rootfs" >> "$GITHUB_ENV"
          echo "OPENWRT_ROOTFS_SHA256=$rootfs_sha" >> "$GITHUB_ENV"
      - name: Restore verified OpenWrt rootfs archive
        uses: actions/cache@v6
        with:
          path: .cache/openwrt/${{ steps.openwrt-rootfs.outputs.filename }}
          key: openwrt-rootfs-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENWRT_VERSION }}-${{ steps.openwrt-rootfs.outputs.sha256 }}
      - name: Set up verified OpenWrt rootfs
        shell: bash
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}"
          archive=".cache/openwrt/$OPENWRT_ROOTFS"
          mkdir -p "$(dirname "$archive")"
          if [ ! -f "$archive" ]; then
            curl -fsSL "$base/$OPENWRT_ROOTFS" -o "$archive"
          fi
          printf '%s *%s\n' "$OPENWRT_ROOTFS_SHA256" "$archive" | sha256sum -c -
          mkdir rootfs
          sudo tar -xzf "$archive" -C rootfs
          # /etc/resolv.conf in the rootfs is a dangling symlink to /tmp/resolv.conf;
          # drop it first so copying in the host resolv.conf succeeds.
          sudo rm -f rootfs/etc/resolv.conf
          sudo cp /etc/resolv.conf rootfs/etc/resolv.conf
      - name: Install ucode modules in rootfs
        shell: bash
        run: |
          set -euo pipefail
          # The rootfs ships without CA certificates, and OpenWrt's busybox wget
          # does not reliably honour a host CA bundle copied into /etc/ssl/certs
          # (verified: TLS fails for every repo with "Generic error"). This is a
          # CI-only validation rootfs, not the shipped product, so apk verifies
          # the pinned official download.openwrt.org feed over plain validation
          # with --no-check-certificate. The release build path (build-openwrt.yml)
          # verifies the SDK tarball checksum and pins feeds separately.
          if sudo chroot rootfs /bin/sh -c 'command -v apk >/dev/null 2>&1'; then
            sudo chroot rootfs /bin/sh -c 'apk update --no-check-certificate && apk add --no-check-certificate ucode ucode-mod-fs ucode-mod-ubus ucode-mod-uci ucode-mod-rtnl ucode-mod-uloop ucode-mod-socket ucode-mod-log'
          elif sudo chroot rootfs /bin/sh -c 'command -v opkg >/dev/null 2>&1'; then
            sudo chroot rootfs /bin/sh -c 'opkg update && opkg install ucode ucode-mod-fs ucode-mod-ubus ucode-mod-uci ucode-mod-rtnl ucode-mod-uloop ucode-mod-socket ucode-mod-log'
          else
            echo 'No supported OpenWrt package manager in rootfs' >&2
            exit 1
          fi
      - name: Compile Core ucode on OpenWrt userspace
        shell: bash
        run: |
          set -euo pipefail
          sudo install -D -m 0755 package/performance-manager/files/usr/sbin/performance-manager.uc rootfs/usr/sbin/performance-manager.uc
          sudo install -D -m 0644 package/performance-manager/files/usr/share/performance-manager/contracts.uc rootfs/usr/share/performance-manager/contracts.uc
          sudo chroot rootfs /usr/bin/ucode -c -o /tmp/performance-manager.uc /usr/sbin/performance-manager.uc
      - name: Build + run REAL Core runtime harness (behavioral, not substring)
        shell: bash
        run: |
          set -euo pipefail
          # Layer 2: execute the ACTUAL performance-manager.uc (the same raw,
          # forward-reference-free source the service ships and the APK installs)
          # against runtime-shaped fixtures. This is
          # the real behavioral regression the prompt requires — Multi-WAN/PBR via
          # route/rule evidence, underlay resolution, path-specific workload,
          # nft candidate-only masking, methodology mismatch, Conservative
          # semantics and Rill fail-closed. It is NOT a Python mirror.
          python3 tools/docker-validate/harness/build-harness.py /tmp/core_runtime_test.uc
          sudo cp /tmp/core_runtime_test.uc rootfs/tmp/core_runtime_test.uc
          if ! sudo chroot rootfs /usr/bin/ucode /tmp/core_runtime_test.uc 2>&1 | tee core-runtime-harness.log; then
            exit 1
          fi
      - name: Upload real Core runtime harness report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-runtime-harness
          path: core-runtime-harness.log
          if-no-files-found: warn
      - name: Raw shipped Core daemon startup smoke (ubus publish + calls)
        shell: bash
        run: |
          set -euo pipefail
          # CORE BLOCKER C: boot the ACTUAL shipped performance-manager.uc as a
          # daemon (verbatim, zero forward references, NO convert_hoist) inside
          # the rootfs with a live ubusd, then assert the ubus object publishes
          # and status/topology/capabilities answer well-formed JSON.
          python3 tools/docker-validate/startup-smoke.py rootfs
          python3 - "$GITHUB_WORKSPACE" <<'PY'
          import json, sys
          ev = json.load(open(f"{sys.argv[1]}/docs/core-startup-smoke.json"))
          if not ev.get("ok"):
              print(f"FAIL: core startup smoke not ok: {ev}")
              sys.exit(1)
          print(f"core-startup-smoke: {ev['coreSha256']} methods={list(ev['methods'])}")
          PY
      - name: Emit same-commit Core runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          smoke = json.load(open('docs/core-startup-smoke.json'))
          result = {
              'schemaVersion': 1,
              'gate': 'official-openwrt-rootfs-production-core-runtime',
              'pmCommitSha': os.environ['GITHUB_SHA'],
              'harnessLogPresent': bool(open('core-runtime-harness.log').read().strip()),
              'startupSmoke': smoke,
              'verdict': 'PASS' if smoke.get('ok') else 'FAIL',
          }
          open('docs/core-runtime.json', 'w').write(json.dumps(result, indent=2) + '\n')
          PY
      - name: Upload raw Core runtime reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-startup-smoke
          path: |
            core-startup-smoke.log
            docs/core-startup-smoke.json
            docs/core-runtime.json
          if-no-files-found: error

  adapter-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: x86_64-unknown-linux-musl
          components: rustfmt, clippy
      - name: PM-owned adapter quality gates
        shell: bash
        run: |
          set -euo pipefail
          cd integrations/performance-manager-rill-adapter
          cargo fmt --check
          cargo metadata --locked --format-version 1 >/tmp/pm-adapter-metadata.json
          cargo tree --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --release --target x86_64-unknown-linux-musl
          test "$(target/x86_64-unknown-linux-musl/release/performance-manager-rill-adapter --version | head -n1)" = "performance-manager-rill-adapter 1.0.3"

  # Final release evidence aggregation (rc.7 prompt 29/43): downloads the
  # per-job Rill evidence from the three Rill jobs and runs the authoritative
  # aggregator, which enforces (1) a same-commit evidence chain and (2)
  # combine_required verdict combination (ANY FAIL -> FAIL; ALL PASS -> PASS;
  # otherwise BLOCKED).  This job gates ci.yml on the Rill chain ONLY
  # (--scope rill); the SDK/APK chain is gated by the build-openwrt.yml
  # workflow's own aggregator job, so neither workflow can falsely PASS what
  # the other workflow alone can prove.
  final-release-evidence:
    runs-on: ubuntu-latest
    needs: [pm-rill-provenance, pm-rill-runtime, pm-core-rill-roundtrip, adapter-rust]
    steps:
      - uses: actions/checkout@v7
      - name: Download all Rill per-job evidence
        uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: evidence
          merge-multiple: true
      - name: Aggregate same-commit Rill evidence
        run: |
          set -euo pipefail
          mkdir -p docs
          copy_unique_evidence() {
            local name="$1"
            local required="$2"
            local -a matches=()
            mapfile -t matches < <(find evidence -type f -name "$name" -print)
            if [ "${#matches[@]}" -eq 1 ]; then
              cp "${matches[0]}" "docs/$name"
              return 0
            fi
            if [ "$required" = required ] || [ "${#matches[@]}" -gt 1 ]; then
              echo "Expected exactly one $name, found ${#matches[@]}" >&2
              return 1
            fi
          }
          copy_unique_evidence rill-provenance.json required
          copy_unique_evidence rill-runtime.json required
          copy_unique_evidence rill-core-integration.json required
          copy_unique_evidence rill-wire-harness.json optional
          copy_unique_evidence rill-consumed-manifest.json required
          python3 scripts/aggregate_final_evidence.py \
            --evidence-dir docs --scope rill \
            --expected-commit "$GITHUB_SHA" \
            --out docs/final-release-evidence.json
      - name: Upload final release evidence
        uses: actions/upload-artifact@v7
        with:
          name: final-release-evidence
          path: docs/final-release-evidence.json
          if-no-files-found: error
