name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check jsonschema pyyaml
      - run: make audit
      - name: LuCI JavaScript syntax and render smoke
        shell: bash
        run: |
          set -euo pipefail
          for f in package/luci-app-performance-manager/htdocs/luci-static/resources/performance-manager/*.js \
                   package/luci-app-performance-manager/htdocs/luci-static/resources/view/performance-manager/*.js; do
            { echo '(function(){'; cat "$f"; echo '})();'; } > /tmp/luci-check.js
            node --check /tmp/luci-check.js
          done
          node scripts/luci_render_smoke.js
      - name: Upload static audit evidence
        uses: actions/upload-artifact@v7
        with:
          name: source-audit-evidence
          path: |
            docs/FINAL_AUDIT.md
            docs/FINAL_AUDIT.json
            docs/source-audit.json
            docs/SOURCE_GATES.json
            docs/HOST_SYNTAX_REPORT.json
            docs/RESOURCE_BUDGET.json
            docs/rill-integration-status.json
          if-no-files-found: error

  rill-runtime-v3:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v7
      - name: Install musl toolchain for OpenWrt-compatible Runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
      - name: Resolve exact upstream source identity
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -r '.resolved.version' contracts/rill-runtime.json)
          commit=$(jq -r '.preview.commit // .resolved.upstreamCommit' contracts/rill-runtime.json)
          hash=$(jq -r '.resolved.sourceArchiveSha256' contracts/rill-runtime.json)
          [[ "$version" =~ ^1\.[0-9]+\.[0-9]+$ ]]
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$hash" =~ ^[0-9a-f]{64}$ ]]
          git clone --filter=blob:none https://github.com/hello-yunshu/rill-ml.git rill-ml
          git -C rill-ml fetch --depth=1 origin "$commit"
          git -C rill-ml checkout --detach "$commit"
          test "$(git -C rill-ml rev-parse HEAD)" = "$commit"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build exact OpenWrt-compatible Runtime binary
        run: cargo build --locked --release --target x86_64-unknown-linux-musl --manifest-path rill-ml/Cargo.toml -p rill-runtime
      - name: Run real v3 subprocess lifecycle
        run: |
          set -euo pipefail
          mkdir -p rill-evidence
          python3 scripts/rill_runtime_v3_integration.py \
            --binary rill-ml/target/x86_64-unknown-linux-musl/release/rill-runtime \
            --out rill-evidence/runtime-v3.json
          runtime_sha=$(jq -r '.runtimeSha256' rill-evidence/runtime-v3.json)
          jq --arg commit "$GITHUB_SHA" --arg version "$(jq -r '.resolved.version' contracts/rill-runtime.json)" \
            '. + {pmCommitSha:$commit, overallVerdict:"BLOCKED", runtimeCompatibilityVerdict:"PASS", functionalIntegrationVerdict:"PASS", runtimeVersion:$version, functionalIntegrationReason:"generic Runtime lifecycle is exercised here; PM Core-to-Runtime production roundtrip is owned by the SDK/target gate"}' \
            rill-evidence/runtime-v3.json > rill-evidence/rill-runtime.json
          jq -n --arg commit "$GITHUB_SHA" --arg owner "hello-yunshu/rill-ml" \
            --arg upstreamCommit "$(jq -r '.preview.commit // .resolved.upstreamCommit' contracts/rill-runtime.json)" \
            --arg version "$(jq -r '.resolved.version' contracts/rill-runtime.json)" \
            --arg sha "$runtime_sha" \
            '{schemaVersion:1, contract:"rill-runtime-provenance", pmCommitSha:$commit, provenanceVerdict:"PASS", runtimeSha256:$sha, runtimeOwner:$owner, upstreamCommit:$upstreamCommit, runtimeVersion:$version}' \
            > rill-evidence/rill-provenance.json
          python3 scripts/aggregate_final_evidence.py --evidence-dir rill-evidence --scope rill-runtime \
            --expected-commit "$GITHUB_SHA" --out rill-evidence/final-release-evidence.json
          tar -czf rill-evidence/rill-runtime.tar.gz \
            -C rill-ml/target/x86_64-unknown-linux-musl/release rill-runtime
      - name: Verify package contract against exact package commit
        shell: bash
        run: |
          set -euo pipefail
          package_commit=$(jq -r '.openwrtPackage.commit' contracts/rill-runtime.json)
          git clone --filter=blob:none https://github.com/hello-yunshu/rill-openwrt-packages.git rill-openwrt-packages
          git -C rill-openwrt-packages fetch --depth=1 origin "$package_commit"
          git -C rill-openwrt-packages checkout --detach "$package_commit"
          python3 scripts/check_rill_dependency.py --package-dir rill-openwrt-packages
      - name: Upload real Runtime evidence
        uses: actions/upload-artifact@v7
        with:
          name: rill-runtime-v3-evidence
          path: rill-evidence/
          if-no-files-found: error

  production-core-rill-integration:
    runs-on: ubuntu-latest
    needs: rill-runtime-v3
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Download exact Runtime binary artifact
        uses: actions/download-artifact@v8
        with:
          name: rill-runtime-v3-evidence
          path: rill-runtime-input
      - name: Extract and verify exact Runtime binary artifact
        run: |
          set -euo pipefail
          tar -xzf rill-runtime-input/rill-runtime.tar.gz -C rill-runtime-input
          test -x rill-runtime-input/rill-runtime
      - name: Prepare official OpenWrt ucode image with the exact Runtime
        shell: bash
        run: |
          set -euo pipefail
          base='https://downloads.openwrt.org/releases/25.12.5/targets/x86/64'
          rootfs='openwrt-25.12.5-x86-64-rootfs.tar.gz'
          curl --fail --silent --show-error --location --retry 3 "$base/sha256sums" -o /tmp/rootfs-sha256sums
          rootfs_sha=$(awk -v f="*$rootfs" '$2 == f {print $1}' /tmp/rootfs-sha256sums)
          [[ "$rootfs_sha" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p /tmp/openwrt-cache .portable-rootfs
          archive="/tmp/openwrt-cache/$rootfs"
          curl --fail --silent --show-error --location --retry 3 "$base/$rootfs" -o "$archive"
          printf '%s *%s\n' "$rootfs_sha" "$archive" | sha256sum -c -
          sudo tar -xzf "$archive" -C .portable-rootfs
          sudo rm -f .portable-rootfs/etc/resolv.conf
          sudo cp /etc/resolv.conf .portable-rootfs/etc/resolv.conf
          sudo chroot .portable-rootfs /bin/sh -c 'apk update --no-check-certificate && apk add --no-check-certificate ucode ucode-mod-fs ucode-mod-ubus ucode-mod-uci ucode-mod-rtnl ucode-mod-uloop ucode-mod-socket ucode-mod-log coreutils-timeout'
          sudo install -D -m 0755 rill-runtime-input/rill-runtime .portable-rootfs/usr/bin/rill-runtime
          sudo install -D -m 0644 package/performance-manager/files/usr/share/performance-manager/contracts.uc .portable-rootfs/usr/share/performance-manager/contracts.uc
          sudo chown -R "$(id -u):$(id -g)" .portable-rootfs
          docker build --file tools/docker-validate/Dockerfile.local --tag pm-production-ucode:ci .
      - name: Execute raw production Core against real Runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/docker-validate/harness/build-harness.py "$RUNNER_TEMP/production_core_rill_test.uc" tools/docker-validate/harness/production_core_rill_test.uc.frag
          mkdir -p production-evidence
          python3 scripts/production_core_rill_integration.py \
            --binary rill-runtime-input/rill-runtime \
            --docker-image pm-production-ucode:ci \
            --harness "$RUNNER_TEMP/production_core_rill_test.uc" \
            --expected-commit "$GITHUB_SHA" \
            --out production-evidence/rill-core-integration.json
      - name: Upload production Core evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-core-rill-integration-evidence
          path: production-evidence/
          if-no-files-found: error
