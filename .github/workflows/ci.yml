name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_VERSION: "25.12.5"
  OPENWRT_TARGET: "x86/64"

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/setup-node@1d0ff469b7ec7b3eed9c4d3e94baad0c9a588e43
        with:
          node-version: "22"
      - run: python -m pip install --disable-pip-version-check jsonschema pyyaml
      - run: make audit
      - name: LuCI JavaScript syntax + render smoke
        shell: bash
        run: |
          set -euo pipefail
          for f in package/luci-app-performance-manager/htdocs/luci-static/resources/performance-manager/*.js \
                   package/luci-app-performance-manager/htdocs/luci-static/resources/view/performance-manager/*.js; do
            { echo '(function(){'; cat "$f"; echo '})();'; } > /tmp/luci-check.js
            node --check /tmp/luci-check.js
          done
          # Runtime render harness (not just syntax): catches Blocker-1 style
          # temporal-dead-zone crashes in the LuCI benchmark view.
          node scripts/luci_render_smoke.js
      - name: Python companion syntax
        run: python -m py_compile companion/pm_companion_agent.py
      - name: Upload source/behavior audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-audit-evidence
          path: |
            docs/FINAL_AUDIT.md
            docs/FINAL_AUDIT.json
            docs/SOURCE_GATES.json
            docs/HOST_SYNTAX_REPORT.json
            docs/RESOURCE_BUDGET.json
          if-no-files-found: error

  # Rill is an EXTERNAL runtime owned, built and released by its upstream
  # repository (hello-yunshu/rill-ml). This repository never compiles or natively
  # tests Rill, so there is deliberately NO Rust toolchain/cargo job here.
  #
  # Provenance (this job): verifies the immutable v1.2.0 Stable pin end-to-end —
  # tag identity (v1.2.0 -> dc96fdb3...) -> signed stable-index (Ed25519) ->
  # exact x86_64-musl pm-adapter -> size+SHA integrity — via
  # scripts/verify_rill_release.py, and runs the mock-adapter pm-rill-shadow v1
  # wire harness for the PM-side fail-closed decision table. The verified
  # adapter artifact is uploaded here and consumed (never re-downloaded with
  # `latest`) by the runtime / roundtrip jobs below.
  pm-rill-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check pyyaml jsonschema pynacl
      - name: Verify PM<->Rill static dependency/protocol contract
        run: python scripts/rill_contract_check.py
      - name: Verify v1.2.0 Stable release provenance (tag + signed index + artifact)
        run: python scripts/verify_rill_release.py --out-dir docs
      - name: Run pm-rill-shadow v1 wire harness (fail-closed decision table)
        run: python scripts/rill_runtime_harness.py
      - name: Generate Rill consumed manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_WORKSPACE" <<'PY'
          import json, sys
          root = sys.argv[1]
          dep = json.load(open(f"{root}/contracts/rill-dependency.json"))
          proto = dep.get("protocol", {})
          up = dep.get("upstream", {})
          idx = up.get("releaseIndex", {}) or {}
          art = up.get("artifact", {}) or {}
          adv = up.get("adapter", {}) or {}
          tgt = adv.get("target", {}) or {}
          manifest = {
            "schemaVersion": 1,
            "contract": "pm<->rill-consumed-release",
            "upstreamRepository": up.get("repository"),
            "protocolContract": proto.get("contract"),
            "protocolVersion": proto.get("protocolVersion"),
            "releaseVersion": up.get("releaseVersion"),
            "releaseTag": up.get("releaseTag"),
            "releaseCommitSha": up.get("tagCommitSha"),
            "releaseIndexSchemaVersion": idx.get("schemaVersion"),
            "releaseChannel": idx.get("channel"),
            "adapterReleaseAssetVersion": adv.get("releaseAssetVersion"),
            "adapterVersion": adv.get("adapterVersion"),
            "adapterArtifactId": adv.get("id"),
            "adapterTargetOs": tgt.get("os"),
            "adapterTargetArch": tgt.get("arch"),
            "adapterTargetLibc": tgt.get("libc"),
            "artifactName": art.get("name") or adv.get("name"),
            "artifactSha256": art.get("sha256") or adv.get("sha256"),
            "artifactSize": art.get("size") or adv.get("size"),
            "status": up.get("status", "external-dependency-blocked"),
            "blockedReason": up.get("blockedReason"),
            "provisioned": bool(adv.get("sha256")),
            "tagIdentityVerdict": "verified by scripts/verify_rill_release.py -> docs/rill-provenance.json",
            "note": "PM never compiles Rill; this manifest records the immutable v1.2.0 Stable release this repo consumes. The Rill release bundle version (1.2.0), the rill-pm-adapter crate/binary version (0.15.0) and the pm-rill-shadow protocol version (1) are deliberately kept distinct; minimumRillVersion is a deprecated alias for minimumReleaseVersion and must never be compared against adapter --version."
          }
          with open(f"{root}/rill-consumed-manifest.json", "w") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(json.dumps({"status": manifest["status"], "releaseVersion": manifest["releaseVersion"],
                            "protocolContract": manifest["protocolContract"], "protocolVersion": manifest["protocolVersion"]}))
          PY
      - name: Upload Rill provenance + verified adapter artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rill-provenance
          path: |
            docs/rill-provenance.json
            docs/rill-stable-index.json
            docs/rill-integration-status.json
            docs/rill-integration-evidence.json
            docs/rill-pm-adapter-1.2.0-linux-x86_64-musl
            rill-consumed-manifest.json
          if-no-files-found: error

  # Real released adapter execution inside the official OpenWrt rootfs.
  # Consumes the EXACT verified v1.2.0 x86_64-musl pm-adapter from provenance,
  # executes it (--version -> 0.15.0), starts it and drives the real
  # pm-rill-shadow v1 status/observe/outcome roundtrips plus fail-closed
  # negatives through scripts/rill_adapter_runtime.py. No mock, no Core mirror.
  pm-rill-runtime:
    runs-on: ubuntu-latest
    needs: pm-rill-provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download verified adapter artifact from provenance
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: rill-provenance
          path: rill-evidence
      - name: Set up official OpenWrt rootfs (musl x86_64)
        shell: bash
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}"
          rootfs="openwrt-${OPENWRT_VERSION}-x86-64-rootfs.tar.gz"
          curl -fsSLO "$base/sha256sums"
          curl -fsSLO "$base/$rootfs"
          grep -e "\\*$rootfs$" sha256sums | sha256sum -c -
          mkdir rootfs
          sudo tar -xzf "$rootfs" -C rootfs
          sudo rm -f rootfs/etc/resolv.conf
          sudo cp /etc/resolv.conf rootfs/etc/resolv.conf
          sudo chroot rootfs /bin/sh -c 'apk update --no-check-certificate && apk add --no-check-certificate ucode ucode-mod-ubus ucode-mod-uci ucode-mod-ulib ucode-mod-socket ucode-mod-log' || \
          sudo chroot rootfs /bin/sh -c 'opkg update && opkg install ucode ucode-mod-ubus ucode-mod-uci ucode-mod-socket ucode-mod-log'
      - name: Execute released adapter + real protocol roundtrip
        shell: bash
        run: |
          set -euo pipefail
          chmod +x rill-evidence/docs/rill-pm-adapter-1.2.0-linux-x86_64-musl
          sudo install -D -m 0755 rill-evidence/docs/rill-pm-adapter-1.2.0-linux-x86_64-musl rootfs/usr/bin/rill-pm-adapter
          sudo mkdir -p rootfs/run rootfs/etc/performance-manager/rill
          # Start the EXACT released adapter inside the musl rootfs.
          sudo nohup chroot rootfs /usr/bin/rill-pm-adapter --socket /run/pm-rill.sock --state-dir /etc/performance-manager/rill --max-message 65536 --timeout-ms 1000 >/dev/null 2>&1 &
          ADAPTER_PID=$!
          trap 'sudo pkill -f "rill-pm-adapter.*pm-rill.sock" 2>/dev/null || true' EXIT
          # Wait for the socket.
          for i in $(seq 1 20); do
            [ -S rootfs/run/pm-rill.sock ] && break
            sleep 0.5
          done
          # Real protocol client against the REAL binary (no mock).
          # The host path to the running socket is rootfs/run/pm-rill.sock.
          sudo python3 scripts/rill_adapter_runtime.py \
            --adapter rootfs/usr/bin/rill-pm-adapter \
            --socket rootfs/run/pm-rill.sock \
            --state-dir rootfs/etc/performance-manager/rill \
            --out-dir docs
      - name: Upload real adapter runtime + protocol evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rill-runtime-evidence
          path: |
            docs/rill-adapter-version.txt
            docs/rill-adapter-runtime.log
            docs/rill-protocol-roundtrip.json
            docs/rill-integration-evidence.json
          if-no-files-found: error

  # Real shipped PM Core <-> real released v1.2.0 adapter inside the rootfs.
  # Installs the RAW performance-manager.uc + the verified adapter at the shared
  # empty-binary default path, starts ubusd + adapter + Core, then asserts
  # `ubus call performance-manager rill_status` negotiated the real adapter
  # (available, release 1.2.0, adapter 0.15.0, protocol 1, binary /usr/bin/...).
  pm-core-rill-roundtrip:
    runs-on: ubuntu-latest
    needs: pm-rill-provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download verified adapter artifact from provenance
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: rill-provenance
          path: rill-evidence
      - name: Set up official OpenWrt rootfs with ubus + ucode (x86_64)
        shell: bash
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}"
          rootfs="openwrt-${OPENWRT_VERSION}-x86-64-rootfs.tar.gz"
          curl -fsSLO "$base/sha256sums"
          curl -fsSLO "$base/$rootfs"
          grep -e "\\*$rootfs$" sha256sums | sha256sum -c -
          mkdir rootfs
          sudo tar -xzf "$rootfs" -C rootfs
          sudo rm -f rootfs/etc/resolv.conf
          sudo cp /etc/resolv.conf rootfs/etc/resolv.conf
          sudo chroot rootfs /bin/sh -c 'apk update --no-check-certificate && apk add --no-check-certificate ucode ucode-mod-fs ucode-mod-ubus ucode-mod-uci ucode-mod-rtnl ucode-mod-uloop ucode-mod-socket ucode-mod-log' || \
          sudo chroot rootfs /bin/sh -c 'opkg update && opkg install ucode ucode-mod-fs ucode-mod-ubus ucode-mod-uci ucode-mod-rtnl ucode-mod-uloop ucode-mod-socket ucode-mod-log'
      - name: Real Core <-> released adapter roundtrip
        shell: bash
        run: |
          set -euo pipefail
          chmod +x rill-evidence/docs/rill-pm-adapter-1.2.0-linux-x86_64-musl
          sudo python3 scripts/rill_core_roundtrip.py "$PWD/rootfs" "$PWD/rill-evidence/docs/rill-pm-adapter-1.2.0-linux-x86_64-musl"
      - name: Verify roundtrip evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_WORKSPACE" <<'PY'
          import json, sys
          ev = json.load(open(f"{sys.argv[1]}/docs/pm-core-rill-roundtrip.json"))
          if ev.get("verdict") != "PASS":
              print(f"FAIL: pm-core-rill-roundtrip verdict={ev.get('verdict')}: {ev.get('checks')}")
              sys.exit(1)
          print(f"pm-core-rill-roundtrip: PASS state={ev['checks']}")
          PY
      - name: Upload real Core<->adapter roundtrip evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pm-core-rill-roundtrip
          path: |
            pm-core-rill-roundtrip.log
            docs/pm-core-rill-roundtrip.json
            docs/rill-integration-evidence.json
          if-no-files-found: error

  openwrt-ucode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download official OpenWrt rootfs and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}"
          rootfs="openwrt-${OPENWRT_VERSION}-x86-64-rootfs.tar.gz"
          curl -fsSLO "$base/sha256sums"
          curl -fsSLO "$base/$rootfs"
          grep -e "\\*$rootfs$" sha256sums | sha256sum -c -
          mkdir rootfs
          sudo tar -xzf "$rootfs" -C rootfs
          # /etc/resolv.conf in the rootfs is a dangling symlink to /tmp/resolv.conf;
          # drop it first so copying in the host resolv.conf succeeds.
          sudo rm -f rootfs/etc/resolv.conf
          sudo cp /etc/resolv.conf rootfs/etc/resolv.conf
      - name: Install ucode modules in rootfs
        shell: bash
        run: |
          set -euo pipefail
          # The rootfs ships without CA certificates, and OpenWrt's busybox wget
          # does not reliably honour a host CA bundle copied into /etc/ssl/certs
          # (verified: TLS fails for every repo with "Generic error"). This is a
          # CI-only validation rootfs, not the shipped product, so apk verifies
          # the pinned official download.openwrt.org feed over plain validation
          # with --no-check-certificate. The release build path (build-openwrt.yml)
          # verifies the SDK tarball checksum and pins feeds separately.
          if sudo chroot rootfs /bin/sh -c 'command -v apk >/dev/null 2>&1'; then
            sudo chroot rootfs /bin/sh -c 'apk update --no-check-certificate && apk add --no-check-certificate ucode ucode-mod-fs ucode-mod-ubus ucode-mod-uci ucode-mod-rtnl ucode-mod-uloop ucode-mod-socket ucode-mod-log'
          elif sudo chroot rootfs /bin/sh -c 'command -v opkg >/dev/null 2>&1'; then
            sudo chroot rootfs /bin/sh -c 'opkg update && opkg install ucode ucode-mod-fs ucode-mod-ubus ucode-mod-uci ucode-mod-rtnl ucode-mod-uloop ucode-mod-socket ucode-mod-log'
          else
            echo 'No supported OpenWrt package manager in rootfs' >&2
            exit 1
          fi
      - name: Compile Core ucode on OpenWrt userspace
        shell: bash
        run: |
          set -euo pipefail
          sudo install -D -m 0755 package/performance-manager/files/usr/sbin/performance-manager.uc rootfs/usr/sbin/performance-manager.uc
          sudo install -D -m 0644 package/performance-manager/files/usr/share/performance-manager/contracts.uc rootfs/usr/share/performance-manager/contracts.uc
          sudo chroot rootfs /usr/bin/ucode -c -o /tmp/performance-manager.uc /usr/sbin/performance-manager.uc
      - name: Build + run REAL Core runtime harness (behavioral, not substring)
        shell: bash
        run: |
          set -euo pipefail
          # Layer 2: execute the ACTUAL performance-manager.uc (the same raw,
          # forward-reference-free source the service ships and the APK installs)
          # against runtime-shaped fixtures. This is
          # the real behavioral regression the prompt requires — Multi-WAN/PBR via
          # route/rule evidence, underlay resolution, path-specific workload,
          # nft candidate-only masking, methodology mismatch, Conservative
          # semantics and Rill fail-closed. It is NOT a Python mirror.
          python3 tools/docker-validate/harness/build-harness.py /tmp/core_runtime_test.uc
          sudo cp /tmp/core_runtime_test.uc rootfs/tmp/core_runtime_test.uc
          sudo chroot rootfs /usr/bin/ucode /tmp/core_runtime_test.uc > core-runtime-harness.log 2>&1 || { cat core-runtime-harness.log >&2; exit 1; }
          cat core-runtime-harness.log
      - name: Upload real Core runtime harness report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-runtime-harness
          path: core-runtime-harness.log
          if-no-files-found: warn
      - name: Raw shipped Core daemon startup smoke (ubus publish + calls)
        shell: bash
        run: |
          set -euo pipefail
          # CORE BLOCKER C: boot the ACTUAL shipped performance-manager.uc as a
          # daemon (verbatim, zero forward references, NO convert_hoist) inside
          # the rootfs with a live ubusd, then assert the ubus object publishes
          # and status/topology/capabilities answer well-formed JSON.
          python3 tools/docker-validate/startup-smoke.py rootfs
          python3 - "$GITHUB_WORKSPACE" <<'PY'
          import json, sys
          ev = json.load(open(f"{sys.argv[1]}/docs/core-startup-smoke.json"))
          if not ev.get("ok"):
              print(f"FAIL: core startup smoke not ok: {ev}")
              sys.exit(1)
          print(f"core-startup-smoke: {ev['coreSha256']} methods={list(ev['methods'])}")
          PY
      - name: Upload raw Core startup smoke report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-startup-smoke
          path: |
            core-startup-smoke.log
            docs/core-startup-smoke.json
          if-no-files-found: error
