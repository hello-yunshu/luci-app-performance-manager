name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_VERSION: "25.12.5"
  OPENWRT_TARGET: "x86/64"

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --disable-pip-version-check jsonschema pyyaml
      - run: make audit
      - name: LuCI JavaScript syntax + render smoke
        shell: bash
        run: |
          set -euo pipefail
          for f in package/luci-app-performance-manager/htdocs/luci-static/resources/performance-manager/*.js \
                   package/luci-app-performance-manager/htdocs/luci-static/resources/view/performance-manager/*.js; do
            { echo '(function(){'; cat "$f"; echo '})();'; } > /tmp/luci-check.js
            node --check /tmp/luci-check.js
          done
          # Runtime render harness (not just syntax): catches Blocker-1 style
          # temporal-dead-zone crashes in the LuCI benchmark view.
          node scripts/luci_render_smoke.js
      - name: Python companion syntax
        run: python -m py_compile companion/pm_companion_agent.py

  # Rill is an EXTERNAL runtime owned, built and released by its upstream
  # repository. This repository never compiles or natively tests Rill, so there
  # is deliberately NO Rust toolchain/cargo job here. This job verifies only the
  # pinned upstream Rill release provenance (never `latest`, never empty
  # checksum) and the PM<->Rill protocol/capability contract, and it fails closed
  # when the upstream release entry is misprovisioned or the contract is violated.
  rill-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check pyyaml
      - name: Verify PM<->Rill dependency contract (external runtime)
        run: python scripts/rill_contract_check.py
      - name: Verify pinned upstream Rill release provenance when provisioned
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_WORKSPACE" <<'PY'
          import json, sys, urllib.request, hashlib
          root = sys.argv[1]
          dep = json.load(open(f"{root}/contracts/rill-dependency.json"))
          up = dep.get("upstream") or {}
          if not (up.get("releaseVersion") or up.get("artifactUrl") or up.get("artifactSha256")):
              status = up.get("status")
              expected = "external-dependency-blocked"
              if status != expected:
                  print(f"FAIL: upstream status is {status!r}, expected {expected!r}")
                  sys.exit(1)
              print(f"rill-contract: upstream not provisioned (status={status}); PM fails closed — no release gate asserted")
              sys.exit(0)
          url = up.get("artifactUrl")
          sha = up.get("artifactSha256")
          if not url or "latest/download" in url:
              print("FAIL: provisioned upstream release must pin a versioned artifact URL, never latest/download")
              sys.exit(1)
          if not sha:
              print("FAIL: provisioned upstream release must carry a non-empty artifactSha256")
              sys.exit(1)
          print(f"rill-contract: verifying upstream {up.get('releaseVersion')} from {url}")
          data = urllib.request.urlopen(url, timeout=120).read()
          digest = hashlib.sha256(data).hexdigest()
          if digest != sha:
              print(f"FAIL: artifact SHA-256 mismatch — expected {sha}, got {digest}")
              sys.exit(1)
          print(f"rill-contract: artifact SHA-256 verified ({digest})")
          PY
      - run: python -m py_compile companion/pm_companion_agent.py

  openwrt-ucode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official OpenWrt rootfs and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}"
          rootfs="openwrt-${OPENWRT_VERSION}-x86-64-rootfs.tar.gz"
          curl -fsSLO "$base/sha256sums"
          curl -fsSLO "$base/$rootfs"
          grep -e "\\*$rootfs$" sha256sums | sha256sum -c -
          mkdir rootfs
          sudo tar -xzf "$rootfs" -C rootfs
          # /etc/resolv.conf in the rootfs is a dangling symlink to /tmp/resolv.conf;
          # drop it first so copying in the host resolv.conf succeeds.
          sudo rm -f rootfs/etc/resolv.conf
          sudo cp /etc/resolv.conf rootfs/etc/resolv.conf
      - name: Install ucode modules in rootfs
        shell: bash
        run: |
          set -euo pipefail
          # The rootfs ships without CA certificates, so busybox wget cannot
          # verify downloads.openwrt.org over TLS. Seed the host CA bundle and
          # fall back to skipping verification for this CI-only validation.
          sudo mkdir -p rootfs/etc/ssl/certs
          sudo cp /etc/ssl/certs/ca-certificates.crt rootfs/etc/ssl/certs/ca-certificates.crt
          if sudo chroot rootfs /bin/sh -c 'command -v apk >/dev/null 2>&1'; then
            sudo chroot rootfs /bin/sh -c 'apk update --no-check-certificate && apk add --no-check-certificate ucode ucode-mod-fs ucode-mod-ubus ucode-mod-uci ucode-mod-rtnl ucode-mod-uloop ucode-mod-socket ucode-mod-log'
          elif sudo chroot rootfs /bin/sh -c 'command -v opkg >/dev/null 2>&1'; then
            sudo chroot rootfs /bin/sh -c 'opkg update && opkg install ucode ucode-mod-fs ucode-mod-ubus ucode-mod-uci ucode-mod-rtnl ucode-mod-uloop ucode-mod-socket ucode-mod-log'
          else
            echo 'No supported OpenWrt package manager in rootfs' >&2
            exit 1
          fi
      - name: Compile Core ucode on OpenWrt userspace
        shell: bash
        run: |
          set -euo pipefail
          sudo install -D -m 0755 package/performance-manager/files/usr/sbin/performance-manager.uc rootfs/usr/sbin/performance-manager.uc
          sudo install -D -m 0644 package/performance-manager/files/usr/share/performance-manager/contracts.uc rootfs/usr/share/performance-manager/contracts.uc
          sudo chroot rootfs /usr/bin/ucode -c -o /tmp/performance-manager.uc /usr/sbin/performance-manager.uc

  # Official OpenWrt SDK build for the packages this repository OWNS:
  # performance-manager (Core), luci-app-performance-manager (UI) and the
  # performance-manager-rill integration package (which never compiles Rill).
  # Real build evidence comes from this remote Action, not local mocks.
  openwrt-sdk-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential gawk gettext libncurses-dev libssl-dev python3 rsync unzip file wget zstd
      - name: Download official SDK and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}"
          curl -fsSL "$base/" -o /tmp/index.html
          sdk=$(grep -oE "openwrt-sdk-${OPENWRT_VERSION}-x86-64_[^\"< ]+\.tar\.zst" /tmp/index.html | head -n1)
          test -n "$sdk"
          curl -fsSL "$base/sha256sums" -o /tmp/sha256sums
          curl -fsSLO "$base/$sdk"
          grep -e "\\*$sdk$" /tmp/sha256sums | sha256sum -c -
          tar --zstd -xf "$sdk"
          sdkdir=$(find . -maxdepth 1 -type d -name "openwrt-sdk-${OPENWRT_VERSION}-x86-64_*" | head -n1)
          test -n "$sdkdir"
          echo "SDKDIR=$sdkdir" >> "$GITHUB_ENV"
          echo "FEEDS_BUILDINFO_URL=$base/feeds.buildinfo" >> "$GITHUB_ENV"
          echo "SDK_CACHE_TAG=${OPENWRT_VERSION}-${OPENWRT_TARGET//\//-}" >> "$GITHUB_ENV"
      - name: Pin feeds to official release feed commits
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDKDIR"
          ./scripts/feeds update -a
          python3 "$GITHUB_WORKSPACE/scripts/pin_feeds.py"
      - name: Install feeds and local packages
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDKDIR"
          ./scripts/feeds install -a
          mkdir -p package/openwrt-performance-manager
          cp -a "$GITHUB_WORKSPACE"/package/* package/openwrt-performance-manager/
          make defconfig
      - name: Build Core
        run: cd "$SDKDIR" && make -j2 package/performance-manager/compile V=s
      - name: Build LuCI
        run: cd "$SDKDIR" && make -j2 package/luci-app-performance-manager/compile V=s
      - name: Build Rill integration package (glue only, never compiles Rill)
        run: cd "$SDKDIR" && make -j2 package/performance-manager-rill/compile V=s
      - name: Assert expected packages present
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDKDIR"
          find bin -name '*.apk' -o -name '*.ipk' | sort
          test -n "$(find bin -name 'performance-manager*.apk' | head -n1)" || { echo 'expected performance-manager APK missing' >&2; exit 1; }
          test -n "$(find bin -name 'luci-app-performance-manager*.apk' | head -n1)" || { echo 'expected luci-app-performance-manager APK missing' >&2; exit 1; }
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.SDK_CACHE_TAG }}-packages
          path: |
            ${{ env.SDKDIR }}/bin/targets/**/packages/*.apk
            ${{ env.SDKDIR }}/bin/targets/**/packages/*.ipk
          if-no-files-found: error