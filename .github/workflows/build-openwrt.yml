name: Build OpenWrt (remote SDK)

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      rill_package_commit:
        description: Immutable commit containing the locked Runtime and manager recipes
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Official OpenWrt SDK build for the packages this repository OWNS:
  # performance-manager (Core), luci-app-performance-manager (UI), the
  # performance-manager-rill integration package, plus the target-specific
  # unified PM IPK/APK. PM split/full and independent
  # consumers share one exact-qualified rill-runtime package owner.
  # Real build evidence comes from this remote Action — never a local mock.
  openwrt-sdk-build:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - openwrt_version: "24.10.8"
            openwrt_target: "x86"
            openwrt_subtarget: "64"
            sdk_prefix: "x86-64"
            package_arch: "x86_64"
            rust_target: "x86_64-unknown-linux-musl"
            package_manager: "ipk"
          - openwrt_version: "24.10.8"
            openwrt_target: "armsr"
            openwrt_subtarget: "armv8"
            sdk_prefix: "armsr-armv8"
            package_arch: "aarch64_generic"
            rust_target: "aarch64-unknown-linux-musl"
            package_manager: "ipk"
          - openwrt_version: "24.10.8"
            openwrt_target: "mediatek"
            openwrt_subtarget: "filogic"
            sdk_prefix: "mediatek-filogic"
            package_arch: "aarch64_cortex-a53"
            rust_target: "aarch64-unknown-linux-musl"
            package_manager: "ipk"
          - openwrt_version: "24.10.8"
            openwrt_target: "bcm27xx"
            openwrt_subtarget: "bcm2711"
            sdk_prefix: "bcm27xx-bcm2711"
            package_arch: "aarch64_cortex-a72"
            rust_target: "aarch64-unknown-linux-musl"
            package_manager: "ipk"
          - openwrt_version: "24.10.8"
            openwrt_target: "bcm27xx"
            openwrt_subtarget: "bcm2712"
            sdk_prefix: "bcm27xx-bcm2712"
            package_arch: "aarch64_cortex-a76"
            rust_target: "aarch64-unknown-linux-musl"
            package_manager: "ipk"
          - openwrt_version: "24.10.8"
            openwrt_target: "ipq40xx"
            openwrt_subtarget: "generic"
            sdk_prefix: "ipq40xx-generic"
            package_arch: "arm_cortex-a7_neon-vfpv4"
            rust_target: "armv7-unknown-linux-musleabihf"
            package_manager: "ipk"
          - openwrt_version: "25.12.6"
            openwrt_target: "x86"
            openwrt_subtarget: "64"
            sdk_prefix: "x86-64"
            package_arch: "x86_64"
            rust_target: "x86_64-unknown-linux-musl"
            package_manager: "apk"
          - openwrt_version: "25.12.6"
            openwrt_target: "armsr"
            openwrt_subtarget: "armv8"
            sdk_prefix: "armsr-armv8"
            package_arch: "aarch64_generic"
            rust_target: "aarch64-unknown-linux-musl"
            package_manager: "apk"
          - openwrt_version: "25.12.6"
            openwrt_target: "mediatek"
            openwrt_subtarget: "filogic"
            sdk_prefix: "mediatek-filogic"
            package_arch: "aarch64_cortex-a53"
            rust_target: "aarch64-unknown-linux-musl"
            package_manager: "apk"
          - openwrt_version: "25.12.6"
            openwrt_target: "bcm27xx"
            openwrt_subtarget: "bcm2711"
            sdk_prefix: "bcm27xx-bcm2711"
            package_arch: "aarch64_cortex-a72"
            rust_target: "aarch64-unknown-linux-musl"
            package_manager: "apk"
          - openwrt_version: "25.12.6"
            openwrt_target: "bcm27xx"
            openwrt_subtarget: "bcm2712"
            sdk_prefix: "bcm27xx-bcm2712"
            package_arch: "aarch64_cortex-a76"
            rust_target: "aarch64-unknown-linux-musl"
            package_manager: "apk"
          - openwrt_version: "25.12.6"
            openwrt_target: "ipq40xx"
            openwrt_subtarget: "generic"
            sdk_prefix: "ipq40xx-generic"
            package_arch: "arm_cortex-a7_neon-vfpv4"
            rust_target: "armv7-unknown-linux-musleabihf"
            package_manager: "apk"
    env:
      OPENWRT_VERSION: ${{ matrix.openwrt_version }}
      OPENWRT_TARGET: ${{ matrix.openwrt_target }}
      OPENWRT_SUBTARGET: ${{ matrix.openwrt_subtarget }}
      SDK_PREFIX: ${{ matrix.sdk_prefix }}
      PACKAGE_ARCH: ${{ matrix.package_arch }}
      RUST_TARGET: ${{ matrix.rust_target }}
      PACKAGE_MANAGER: ${{ matrix.package_manager }}
      RILL_PACKAGE_COMMIT: ${{ github.event.inputs.rill_package_commit || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Checkout canonical Runtime packages at explicit immutable commit
        shell: bash
        run: |
          set -euo pipefail
          contract_commit=$(jq -r '.openwrtPackage.commit' contracts/rill-runtime.json)
          [[ "$contract_commit" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'The Stable Rill package commit is pending; update contracts/rill-runtime.json after Rill qualification.' >&2
            exit 1
          }
          package_commit="${RILL_PACKAGE_COMMIT:-$contract_commit}"
          test -n "$package_commit" || {
            echo 'Set workflow input rill_package_commit or leave it empty to use the contract lock.' >&2
            exit 1
          }
          [[ "$package_commit" =~ ^[0-9a-f]{40}$ ]]
          test "$package_commit" = "$contract_commit" || {
            echo 'The explicit Rill package commit differs from contracts/rill-runtime.json; qualification lock update is pending.' >&2
            exit 1
          }
          git clone --filter=blob:none https://github.com/hello-yunshu/rill-openwrt-packages.git rill-openwrt-packages
          git -C rill-openwrt-packages fetch --depth=1 origin "$package_commit"
          git -C rill-openwrt-packages checkout --detach "$package_commit"
          test "$(git -C rill-openwrt-packages rev-parse HEAD)" = "$package_commit"
          test -f rill-openwrt-packages/package/rill-runtime/Makefile
          test -f rill-openwrt-packages/package/rill-runtime-manager/Makefile || {
            echo 'The immutable Rill package commit does not yet contain rill-runtime-manager.' >&2
            exit 1
          }
      - name: Install SDK host dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_opts[@]}" update
          sudo apt-get "${apt_opts[@]}" install -y build-essential gawk gettext libncurses-dev libssl-dev python3 rsync unzip file wget zstd
      - name: Resolve official SDK identity
        id: openwrt-sdk
        shell: bash
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}"
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 30 --max-time 120 "$base/" -o /tmp/index.html
          sdk=$(grep -oE "openwrt-sdk-${OPENWRT_VERSION}-[^\"< ]+[.]tar[.]zst" /tmp/index.html | grep -m1 -F "${SDK_PREFIX}_")
          test -n "$sdk"
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 30 --max-time 120 "$base/sha256sums" -o /tmp/sha256sums
          # Capture the REAL official SDK archive digest from sha256sums (not a
          # weak filename hash) so build evidence records sdkArchiveSha256.
          # Note: no trailing '$' here — bash would keep it as a literal and the
          # == string comparison would never match the actual field.
          sdk_archive_sha=$(awk -v f="*$sdk" '$2==f {print $1}' /tmp/sha256sums)
          [[ "$sdk_archive_sha" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "SDK_ARCHIVE_SHA256=$sdk_archive_sha"
            echo "SDK_ARCHIVE_NAME=$sdk"
            echo "FEEDS_BUILDINFO_URL=$base/feeds.buildinfo"
            echo "SDK_CACHE_TAG=${OPENWRT_VERSION}-${OPENWRT_TARGET//\//-}-${OPENWRT_SUBTARGET}-${PACKAGE_ARCH}"
          } >> "$GITHUB_ENV"
          echo "filename=$sdk" >> "$GITHUB_OUTPUT"
          echo "sha256=$sdk_archive_sha" >> "$GITHUB_OUTPUT"
      - name: Restore verified OpenWrt SDK archive
        uses: actions/cache@v6
        with:
          path: .cache/openwrt-sdk/${{ steps.openwrt-sdk.outputs.filename }}
          key: openwrt-sdk-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENWRT_VERSION }}-${{ steps.openwrt-sdk.outputs.sha256 }}
      - name: Download official SDK and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}"
          archive=".cache/openwrt-sdk/$SDK_ARCHIVE_NAME"
          mkdir -p "$(dirname "$archive")"
          if [ ! -f "$archive" ]; then
            curl --fail --silent --show-error --location --retry 3 --connect-timeout 30 --max-time 600 "$base/$SDK_ARCHIVE_NAME" -o "$archive"
          fi
          printf '%s *%s\n' "$SDK_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          tar --zstd -xf "$archive"
          sdkdir=$(find . -maxdepth 1 -type d -name "openwrt-sdk-${OPENWRT_VERSION}-${SDK_PREFIX}_*" | head -n1)
          test -n "$sdkdir"
          sdkdir=$(cd "$sdkdir" && pwd)
          # Official SDK archives ship without a .config; the target identity is
          # materialized by `make defconfig` in the feed installation step.
          test -f "$sdkdir/include/target.mk"
          test -f "$sdkdir/Makefile"
          echo "SDKDIR=$sdkdir" >> "$GITHUB_ENV"
      - name: Resolve official feed identity
        id: openwrt-feeds
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$SDKDIR/feeds.buildinfo" ]; then
            curl -fsSL "$FEEDS_BUILDINFO_URL" -o "$SDKDIR/feeds.buildinfo"
          fi
          feeds_sha=$(sha256sum "$SDKDIR/feeds.buildinfo" | awk '{print $1}')
          [[ "$feeds_sha" =~ ^[0-9a-f]{64}$ ]]
          echo "sha256=$feeds_sha" >> "$GITHUB_OUTPUT"
      - name: Restore pinned OpenWrt feed repositories
        id: openwrt-feeds-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.SDKDIR }}/feeds
          key: openwrt-feeds-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENWRT_VERSION }}-${{ steps.openwrt-feeds.outputs.sha256 }}
      - name: Pin feeds to official release feed commits
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDKDIR"
          if [ '${{ steps.openwrt-feeds-cache.outputs.cache-hit }}' != 'true' ]; then
            ./scripts/feeds update -a
          fi
          ./scripts/feeds install rust
          python3 "$GITHUB_WORKSPACE/scripts/pin_feeds.py"
      - name: Install feeds and local packages
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDKDIR"
          ./scripts/feeds install -a
          for rust_makefile in feeds/packages/lang/rust/Makefile feeds/packages/lang/rust/rust-host-build.mk; do
            if [ -f "$rust_makefile" ]; then
              sed -i 's/--set=llvm.download-ci-llvm=true/--set=llvm.download-ci-llvm=false/g' "$rust_makefile"
            fi
          done
          if grep -R -n -- '--set=llvm.download-ci-llvm=true' feeds/packages/lang/rust; then
            echo 'OpenWrt Rust feed still enables CI LLVM downloads' >&2
            exit 1
          fi
          mkdir -p package/openwrt-performance-manager
          cp -a "$GITHUB_WORKSPACE"/package/* package/openwrt-performance-manager/
          # Runtime and its updater are canonical packages from the pinned Rill
          # feed. Include both recipes in the SDK package graph; stage only the
          # already qualified Runtime artifact later, without rebuilding it.
          for name in rill-runtime rill-runtime-manager; do
            test -f "$GITHUB_WORKSPACE/rill-openwrt-packages/package/$name/Makefile"
            mkdir -p "package/$name"
            cp -a "$GITHUB_WORKSPACE/rill-openwrt-packages/package/$name"/. "package/$name/"
          done
          make defconfig
          config="$SDKDIR/.config"
          test -f "$config"
          grep -qx "CONFIG_TARGET_${OPENWRT_TARGET}=y" "$config"
          grep -qx "CONFIG_TARGET_SUBTARGET=\"${OPENWRT_SUBTARGET}\"" "$config"
          grep -qx "CONFIG_TARGET_ARCH_PACKAGES=\"${PACKAGE_ARCH}\"" "$config"
          for package in rill-runtime rill-runtime-manager; do
            # package-metadata.pl emits package symbols indented inside their
            # menu, so match the config record instead of the raw line start.
            grep -qE "^[[:space:]]*config PACKAGE_${package}\$" tmp/.config-package.in || {
              echo "SDK Kconfig cannot resolve required feed package $package" >&2
              grep -c "^Package: " tmp/.packageinfo >&2 || true
              exit 1
            }
          done
      - name: Build Core
        run: cd "$SDKDIR" && bash "$GITHUB_WORKSPACE/scripts/openwrt-build-diagnostic.sh" package/performance-manager/compile
      - name: Clean stale LuCI package output
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDKDIR"
          make package/luci-app-performance-manager/clean
          # A pre-existing same-version APK must never survive a failed or
          # skipped rebuild and then be selected by the exact package verifier.
          package_version=$(sed -E 's/-rc\./_rc/' "$GITHUB_WORKSPACE/VERSION")
          find bin -type f \( \
            -name "luci-app-performance-manager-${package_version}-*.apk" -o \
            -name "luci-app-performance-manager-all-${package_version}-*.apk" \
          \) -delete
      - name: Build LuCI
        run: cd "$SDKDIR" && bash "$GITHUB_WORKSPACE/scripts/openwrt-build-diagnostic.sh" package/luci-app-performance-manager/compile
      - name: Download exact qualified shared Stable Runtime package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          package_commit=$(git -C "$GITHUB_WORKSPACE/rill-openwrt-packages" rev-parse HEAD)
          python3 scripts/check_rill_dependency.py --package-dir rill-openwrt-packages
          python3 rill-openwrt-packages/scripts/qualified_runtime_artifacts.py \
            --channel stable --contract "$GITHUB_WORKSPACE/contracts/rill-runtime.json" \
            --package-dir "$GITHUB_WORKSPACE/rill-openwrt-packages" \
            --openwrt-version "$OPENWRT_VERSION" --architecture "$PACKAGE_ARCH" --pkgtype "$PACKAGE_MANAGER" \
            --apk "${SDKDIR}/staging_dir/host/bin/apk" --output "$RUNNER_TEMP/qualified-rill" \
            > "$RUNNER_TEMP/qualified-rill-selection.json"
          {
            echo "RILL_OPENWRT_PACKAGE_COMMIT=$package_commit"
            echo "RILL_QUALIFIED_PACKAGE=$(jq -r .package "$RUNNER_TEMP/qualified-rill-selection.json")"
            echo "RILL_QUALIFIED_BINARY_SHA256=$(jq -r .qualifiedTarget.binarySha256 "$RUNNER_TEMP/qualified-rill-selection.json")"
          } >> "$GITHUB_ENV"
      - name: Build Rill integration package (glue payload only)
        # NO_DEPS keeps the SDK from rebuilding rill-runtime from source; the
        # dependency closure was completed by the Core/LuCI builds, and the
        # already-qualified Runtime package is staged after this step.
        run: cd "$SDKDIR" && NO_DEPS=1 bash "$GITHUB_WORKSPACE/scripts/openwrt-build-diagnostic.sh" package/performance-manager-rill/compile
      - name: Build shared Runtime management package
        run: cd "$SDKDIR" && bash "$GITHUB_WORKSPACE/scripts/openwrt-build-diagnostic.sh" package/rill-runtime-manager/compile
      - name: Stage exact qualified Runtime package
        shell: bash
        run: |
          set -euo pipefail
          runtime_package="$RILL_QUALIFIED_PACKAGE"
          test -f "$runtime_package"
          runtime_sha=$(python3 - "$runtime_package" <<'PY'
          import hashlib, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from verify_apks import package_file_content
          payload = package_file_content(Path(sys.argv[1]), '/usr/bin/rill-runtime')
          if not payload:
              raise SystemExit('rill-runtime APK lacks /usr/bin/rill-runtime')
          print(hashlib.sha256(payload).hexdigest())
          PY
          )
          test "$runtime_sha" = "$RILL_QUALIFIED_BINARY_SHA256"
          runtime_dir="$SDKDIR/bin/packages/$PACKAGE_ARCH/base"
          mkdir -p "$runtime_dir"
          cp "$runtime_package" "$runtime_dir/$(basename "$runtime_package")"
          # Count only the Runtime itself; rill-runtime-manager also starts
          # with "rill-runtime-" and is built in the previous step.
          test "$(find "$SDKDIR/bin" -type f -name "rill-runtime[-_]*.$PACKAGE_MANAGER" ! -name 'rill-runtime-manager*' | wc -l | tr -d ' ')" -eq 1
          echo "RILL_SHARED_BINARY_SHA256=$runtime_sha" >> "$GITHUB_ENV"
      - name: Build full architecture-specific unified PM package
        # Dependencies (Core, LuCI, glue, manager) are already built and the
        # qualified Runtime is staged; NO_DEPS avoids rebuilding rill-runtime.
        run: cd "$SDKDIR" && NO_DEPS=1 bash "$GITHUB_WORKSPACE/scripts/openwrt-build-diagnostic.sh" package/luci-app-performance-manager-all/compile
      - name: Assert expected packages present (exact package metadata match)
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDKDIR"
          find bin -name "*.$PACKAGE_MANAGER" | sort
          package_version="$(sed -E 's/-rc\./_rc/' "$GITHUB_WORKSPACE/VERSION")"
          rill_runtime_version="$(sed -n 's/^PKG_VERSION:=//p' "$GITHUB_WORKSPACE/rill-openwrt-packages/package/rill-runtime/Makefile")"
          # Exact verification reads package metadata (pkgname/pkgver/arch/deps) instead
          # of filename prefix, so performance-manager and performance-manager-rill
          # can never be confused and a stale rc.3 artifact can never pass.
          # $SDKDIR is a RELATIVE path, so after `cd "$SDKDIR"` above it would
          # resolve to a nested, non-existing directory and rglob would find
          # nothing. Pass the absolute CWD ($PWD), which is the SDK root.
          if [ "$PACKAGE_MANAGER" = apk ]; then
            python3 -m pip install --disable-pip-version-check zstandard
          fi
          python3 "$GITHUB_WORKSPACE/scripts/verify_apks.py" "$PWD" "$package_version" "$PACKAGE_ARCH" "$rill_runtime_version" "$PACKAGE_MANAGER"
      - name: Verify Full, split and independent consumer share Runtime
        if: matrix.package_manager == 'apk'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from verify_apks import apk_pkginfo
          sdk = Path(os.environ['SDKDIR']).resolve()
          wanted = {'full':'luci-app-performance-manager-all', 'core':'performance-manager',
                    'luci':'luci-app-performance-manager', 'glue':'performance-manager-rill'}
          found = {role:[] for role in wanted}
          for path in sdk.joinpath('bin').rglob('*.apk'):
              metadata = apk_pkginfo(path)
              if not metadata:
                  continue
              for role, name in wanted.items():
                  if metadata['pkgname'] == name:
                      found[role].append(path)
          if any(len(paths) != 1 for paths in found.values()):
              raise SystemExit('ownership input packages must resolve exactly once')
          command = ['sudo', 'python3', '-B', 'scripts/verify_runtime_package_ownership.py',
                     '--apk', str(sdk/'staging_dir/host/bin/apk'),
                     '--sdk-dir', str(sdk),
                     '--runtime', os.environ['RILL_QUALIFIED_PACKAGE'],
                     '--runtime-sha256', os.environ['RILL_QUALIFIED_BINARY_SHA256'],
                     '--output', str(Path(os.environ['RUNNER_TEMP'])/'runtime-ownership')]
          for role, paths in found.items():
              command += ['--'+role, str(paths[0])]
          subprocess.run(command, check=True)
          PY
          cp "$RUNNER_TEMP/runtime-ownership/results.json" docs/runtime-ownership.json
      - name: Preserve Runtime ownership evidence, including failures
        if: always() && matrix.package_manager == 'apk'
        uses: actions/upload-artifact@v7
        with:
          name: runtime-ownership-${{ matrix.package_arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/runtime-ownership/results.json
            ${{ runner.temp }}/runtime-ownership/*-then-*/commands.jsonl
          if-no-files-found: warn
      - name: Generate build metadata (auditable evidence)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check jsonschema pyyaml
          # Blocking source audit: a failing audit must fail this workflow; the
          # `|| true` swallower is deliberately removed.
          make audit
          python3 scripts/build_evidence.py
          cat build-metadata.json
      - name: Generate package checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDKDIR"
          find bin -name '*.apk' -o -name '*.ipk' | sort | xargs -r sha256sum > "$GITHUB_WORKSPACE/checksums.txt"
          cd "$GITHUB_WORKSPACE"
          cat checksums.txt
      - name: Stage exact all-in-one release asset
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/stage_all_in_one_release.py \
            --sdk-dir "$SDKDIR" \
            --verification docs/apk-verification.json \
            --out all-in-one-release
      - name: Build private synthetic prior Full APK fixture
        if: matrix.package_manager == 'apk'
        shell: bash
        run: |
          set -euo pipefail
          # This is a real lower-version APK built by the same official SDK.
          # It is private test input only and is never passed to a release
          # assembly or public asset staging step.
          python3 scripts/build_synthetic_prior_fixture.py \
            --sdk-dir "$SDKDIR" \
            --out full-upgrade-prior/synthetic-prior \
            --version 1.0.3 --release 1 --package-arch "$PACKAGE_ARCH" \
            --commit "$GITHUB_SHA"
      - name: Upload exact all-in-one prerelease asset
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-${{ env.SDK_CACHE_TAG }}-all-in-one-package
          path: all-in-one-release/
          if-no-files-found: error
      - name: Upload package artifacts and build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-${{ env.SDK_CACHE_TAG }}-packages-and-evidence
          path: |
            ${{ env.SDKDIR }}/bin/packages/**/*.apk
            ${{ env.SDKDIR }}/bin/packages/**/*.ipk
            ${{ env.SDKDIR }}/bin/targets/**/packages/*.apk
            ${{ env.SDKDIR }}/bin/targets/**/packages/*.ipk
            build-metadata.json
            checksums.txt
            docs/FINAL_AUDIT.md
            docs/FINAL_AUDIT.json
            docs/source-audit.json
            docs/SOURCE_GATES.json
            docs/HOST_SYNTAX_REPORT.json
            docs/RESOURCE_BUDGET.json
            docs/rill-integration-status.json
            docs/apk-verification.json
            docs/runtime-ownership.json
            full-upgrade-prior/
          if-no-files-found: error

  # Final build evidence aggregation (rc.7 prompt 29/43): gates this workflow on
  # the SDK/APK chain ONLY (--scope build) — build-metadata.json verdicts +
  # the exact apk-verification.json report, both tied to the same PM commit.
  # The Rill runtime/functional chain is owned by the ci.yml workflow's own
  # aggregator job, so neither workflow can falsely PASS what the other alone
  # can prove.  A broken same-commit chain or any non-PASS verdict fails closed.
  final-release-evidence:
    runs-on: ubuntu-latest
    needs: openwrt-sdk-build
    steps:
      - uses: actions/checkout@v7
      - name: Download all target SDK build evidence
        uses: actions/download-artifact@v8
        with:
          path: evidence
          pattern: openwrt-*-packages-and-evidence
          merge-multiple: false
      - name: Aggregate final build evidence (same-commit SDK/APK chain)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          copy_unique_evidence() {
            local name="$1"
            local required="$2"
            local -a matches=()
            mapfile -t matches < <(find evidence -type f -name "$name" -print)
            if [ "${#matches[@]}" -eq 1 ]; then
              cp "${matches[0]}" "docs/$name"
              return 0
            fi
            if [ "$required" = required ] || [ "${#matches[@]}" -gt 1 ]; then
              echo "Expected exactly one $name, found ${#matches[@]}" >&2
              return 1
            fi
          }
          python3 scripts/aggregate_build_matrix_evidence.py \
            --input evidence --out docs --expected-commit "$GITHUB_SHA" \
            --expected-target 24.10.8:x86_64:ipk \
            --expected-target 24.10.8:aarch64_generic:ipk \
            --expected-target 24.10.8:aarch64_cortex-a53:ipk \
            --expected-target 24.10.8:aarch64_cortex-a72:ipk \
            --expected-target 24.10.8:aarch64_cortex-a76:ipk \
            --expected-target 24.10.8:arm_cortex-a7_neon-vfpv4:ipk \
            --expected-target 25.12.6:x86_64:apk \
            --expected-target 25.12.6:aarch64_generic:apk \
            --expected-target 25.12.6:aarch64_cortex-a53:apk \
            --expected-target 25.12.6:aarch64_cortex-a72:apk \
            --expected-target 25.12.6:aarch64_cortex-a76:apk \
            --expected-target 25.12.6:arm_cortex-a7_neon-vfpv4:apk
          python3 scripts/aggregate_final_evidence.py \
            --evidence-dir docs --scope build \
            --expected-commit "$GITHUB_SHA" \
            --out docs/final-release-evidence.json
      - name: Upload final build evidence
        uses: actions/upload-artifact@v7
        with:
          name: final-release-evidence-build
          path: docs/final-release-evidence.json
          if-no-files-found: error

  # This gate proves that all successful target artifacts can form the public
  # inventory without publishing a Release.  It is deliberately separate from
  # Stable evidence: package assembly PASS is not runtime or Stable PASS.
  release-assembly-dry-run:
    name: Release assembly dry-run
    runs-on: ubuntu-latest
    needs: openwrt-sdk-build
    steps:
      - uses: actions/checkout@v7
      - name: Download all target packages and evidence
        uses: actions/download-artifact@v8
        with:
          path: release-input
          pattern: openwrt-*-packages-and-evidence
          merge-multiple: false
      - name: Download dedicated all-in-one manifests
        uses: actions/download-artifact@v8
        with:
          path: release-input
          pattern: openwrt-*-all-in-one-package
          merge-multiple: false
      - name: Assemble and validate public inventory without publishing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-public release-evidence
          python3 scripts/assemble_public_release.py \
            --input release-input --out release-public \
            --expected-commit "$GITHUB_SHA" --version "$(cat VERSION)"
          python3 scripts/build_release_manifest.py \
            --assets release-public --input release-input \
            --evidence-dir release-evidence --expected-commit "$GITHUB_SHA" \
            --version "$(cat VERSION)" --dry-run
          python3 scripts/verify_public_release_assets.py \
            --assets release-public --version "$(cat VERSION)"
          python3 scripts/verify_release_inventory.py \
            --assets release-public --version "$(cat VERSION)" \
            --expected-commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: release-assembly-dry-run
          path: |
            release-public/
            release-evidence/
          if-no-files-found: error
