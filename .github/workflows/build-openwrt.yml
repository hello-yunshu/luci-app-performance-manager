name: Build OpenWrt (remote SDK)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Official OpenWrt SDK build for the packages this repository OWNS:
  # performance-manager (Core), luci-app-performance-manager (UI), the
  # performance-manager-rill integration package and temporary compatibility
  # bridge, plus the physical all-in-one APK. The generic rill-runtime package
  # is staged from the independent pinned OpenWrt feed and owns
  # /usr/bin/rill-runtime.
  # Real build evidence comes from this remote Action — never a local mock.
  openwrt-sdk-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - openwrt_version: "25.12.5"
            openwrt_target: "x86"
            openwrt_subtarget: "64"
            sdk_prefix: "x86-64"
            package_arch: "x86_64"
            rust_target: "x86_64-unknown-linux-musl"
            elf_machine: "Advanced Micro Devices X86-64"
          - openwrt_version: "25.12.5"
            openwrt_target: "armsr"
            openwrt_subtarget: "armv8"
            sdk_prefix: "armsr-armv8"
            package_arch: "aarch64_generic"
            rust_target: "aarch64-unknown-linux-musl"
            elf_machine: "AArch64"
    env:
      OPENWRT_VERSION: ${{ matrix.openwrt_version }}
      OPENWRT_TARGET: ${{ matrix.openwrt_target }}
      OPENWRT_SUBTARGET: ${{ matrix.openwrt_subtarget }}
      SDK_PREFIX: ${{ matrix.sdk_prefix }}
      PACKAGE_ARCH: ${{ matrix.package_arch }}
      RUST_TARGET: ${{ matrix.rust_target }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: hello-yunshu/rill-openwrt-packages
          ref: 9af8fe825204b2d1e4a4330dfdb3700f44c392ce
          path: rill-openwrt-packages
      - name: Cache PM Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: pm-openwrt-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'integrations/performance-manager-rill-adapter/Cargo.lock') }}
          restore-keys: |
            pm-openwrt-cargo-${{ runner.os }}-
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.rust_target }}
          components: rustfmt, clippy
      - name: Build and stage PM-owned adapter
        run: python3 scripts/build_pm_adapter.py --target ${{ matrix.rust_target }}
      - name: Install SDK host dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_opts[@]}" update
          sudo apt-get "${apt_opts[@]}" install -y build-essential gawk gettext libncurses-dev libssl-dev python3 rsync unzip file wget zstd
      - name: Resolve official SDK identity
        id: openwrt-sdk
        shell: bash
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}"
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 30 --max-time 120 "$base/" -o /tmp/index.html
          sdk=$(grep -oE "openwrt-sdk-${OPENWRT_VERSION}-[^\"< ]+[.]tar[.]zst" /tmp/index.html | grep -m1 -F "${SDK_PREFIX}_")
          test -n "$sdk"
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 30 --max-time 120 "$base/sha256sums" -o /tmp/sha256sums
          # Capture the REAL official SDK archive digest from sha256sums (not a
          # weak filename hash) so build evidence records sdkArchiveSha256.
          # Note: no trailing '$' here — bash would keep it as a literal and the
          # == string comparison would never match the actual field.
          sdk_archive_sha=$(awk -v f="*$sdk" '$2==f {print $1}' /tmp/sha256sums)
          [[ "$sdk_archive_sha" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "SDK_ARCHIVE_SHA256=$sdk_archive_sha"
            echo "SDK_ARCHIVE_NAME=$sdk"
            echo "FEEDS_BUILDINFO_URL=$base/feeds.buildinfo"
            echo "SDK_CACHE_TAG=${OPENWRT_VERSION}-${OPENWRT_TARGET//\//-}-${OPENWRT_SUBTARGET}-${PACKAGE_ARCH}"
          } >> "$GITHUB_ENV"
          echo "filename=$sdk" >> "$GITHUB_OUTPUT"
          echo "sha256=$sdk_archive_sha" >> "$GITHUB_OUTPUT"
      - name: Restore verified OpenWrt SDK archive
        uses: actions/cache@v6
        with:
          path: .cache/openwrt-sdk/${{ steps.openwrt-sdk.outputs.filename }}
          key: openwrt-sdk-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENWRT_VERSION }}-${{ steps.openwrt-sdk.outputs.sha256 }}
      - name: Download official SDK and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}"
          archive=".cache/openwrt-sdk/$SDK_ARCHIVE_NAME"
          mkdir -p "$(dirname "$archive")"
          if [ ! -f "$archive" ]; then
            curl --fail --silent --show-error --location --retry 3 --connect-timeout 30 --max-time 600 "$base/$SDK_ARCHIVE_NAME" -o "$archive"
          fi
          printf '%s *%s\n' "$SDK_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          tar --zstd -xf "$archive"
          sdkdir=$(find . -maxdepth 1 -type d -name "openwrt-sdk-${OPENWRT_VERSION}-${SDK_PREFIX}_*" | head -n1)
          test -n "$sdkdir"
          echo "SDKDIR=$sdkdir" >> "$GITHUB_ENV"
      - name: Resolve official feed identity
        id: openwrt-feeds
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$SDKDIR/feeds.buildinfo" ]; then
            curl -fsSL "$FEEDS_BUILDINFO_URL" -o "$SDKDIR/feeds.buildinfo"
          fi
          feeds_sha=$(sha256sum "$SDKDIR/feeds.buildinfo" | awk '{print $1}')
          [[ "$feeds_sha" =~ ^[0-9a-f]{64}$ ]]
          echo "sha256=$feeds_sha" >> "$GITHUB_OUTPUT"
      - name: Restore pinned OpenWrt feed repositories
        id: openwrt-feeds-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.SDKDIR }}/feeds
          key: openwrt-feeds-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENWRT_VERSION }}-${{ steps.openwrt-feeds.outputs.sha256 }}
      - name: Pin feeds to official release feed commits
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDKDIR"
          if [ '${{ steps.openwrt-feeds-cache.outputs.cache-hit }}' != 'true' ]; then
            ./scripts/feeds update -a
          fi
          ./scripts/feeds install rust
          python3 "$GITHUB_WORKSPACE/scripts/pin_feeds.py"
      - name: Install feeds and local packages
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDKDIR"
          ./scripts/feeds install -a
          for rust_makefile in feeds/packages/lang/rust/Makefile feeds/packages/lang/rust/rust-host-build.mk; do
            if [ -f "$rust_makefile" ]; then
              sed -i 's/--set=llvm.download-ci-llvm=true/--set=llvm.download-ci-llvm=false/g' "$rust_makefile"
            fi
          done
          if grep -R -n -- '--set=llvm.download-ci-llvm=true' feeds/packages/lang/rust; then
            echo 'OpenWrt Rust feed still enables CI LLVM downloads' >&2
            exit 1
          fi
          RUST_TOOLCHAIN=1.94.0 RUST_STAGING_DIR="$SDKDIR/staging_dir/host" \
            "$GITHUB_WORKSPACE/rill-openwrt-packages/scripts/stage_rust_toolchain.sh"
          "$SDKDIR/staging_dir/host/bin/rustc" --version | grep -F 'rustc 1.94.0'
          mkdir -p package/openwrt-performance-manager
          cp -a "$GITHUB_WORKSPACE"/package/* package/openwrt-performance-manager/
          cp -a "$GITHUB_WORKSPACE"/rill-openwrt-packages/package/rill-runtime package/rill-runtime
          make defconfig
      - name: Build Core
        run: cd "$SDKDIR" && bash "$GITHUB_WORKSPACE/scripts/openwrt-build-diagnostic.sh" package/performance-manager/compile
      - name: Build LuCI
        run: cd "$SDKDIR" && bash "$GITHUB_WORKSPACE/scripts/openwrt-build-diagnostic.sh" package/luci-app-performance-manager/compile
      - name: Build Rill integration package (glue only, never compiles Rill)
        run: cd "$SDKDIR" && bash "$GITHUB_WORKSPACE/scripts/openwrt-build-diagnostic.sh" package/performance-manager-rill/compile
      - name: Build canonical generic Rill Runtime package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          package_commit="$(git -C "$GITHUB_WORKSPACE/rill-openwrt-packages" rev-parse HEAD)"
          qualification_run="$(gh api "repos/hello-yunshu/rill-openwrt-packages/actions/workflows/qualify.yml/runs?head_sha=${package_commit}&status=completed&per_page=100" --jq '.workflow_runs[] | select(.conclusion=="success") | .id' | head -n1)"
          test -n "$qualification_run"
          gh api "repos/hello-yunshu/rill-openwrt-packages/actions/runs/${qualification_run}/artifacts" --jq '.artifacts[] | select(.name=="qualification-evidence" and .expired==false) | .id' | grep -q .
          qualification_dir="$RUNNER_TEMP/rill-qualification"
          mkdir -p "$qualification_dir"
          gh run download "$qualification_run" --repo hello-yunshu/rill-openwrt-packages --name qualification-evidence --dir "$qualification_dir"
          qualification_file=$(find "$qualification_dir" -type f -name qualification.json -print -quit)
          test -n "$qualification_file"
          jq -e --arg arch "$PACKAGE_ARCH" --arg commit "$package_commit" \
            '.schemaVersion==2 and .packageCommit==$commit and .releaseEligible==true
             and (.targets|type)=="array" and any(.targets[]; .packageArch==$arch and .qualificationState=="PASS")' \
            "$qualification_file" >/dev/null
          cd "$SDKDIR"
          unset CI
          bash "$GITHUB_WORKSPACE/scripts/openwrt-build-diagnostic.sh" package/rill-runtime/compile
      - name: Build PM-owned native adapter package
        run: cd "$SDKDIR" && bash "$GITHUB_WORKSPACE/scripts/openwrt-build-diagnostic.sh" package/performance-manager-rill-adapter/compile
      - name: Build all-in-one APK (Core + LuCI + rpcd + zh-cn + Rill glue)
        run: cd "$SDKDIR" && bash "$GITHUB_WORKSPACE/scripts/openwrt-build-diagnostic.sh" package/luci-app-performance-manager-all/compile
      - name: Assert expected packages present (exact APK metadata match)
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDKDIR"
          find bin -name '*.apk' -o -name '*.ipk' | sort
          # Version part of the APK pkgver is derived from VERSION.
          apk_version="$(sed -E 's/-rc\./_rc/' "$GITHUB_WORKSPACE/VERSION")"
          # Exact verification reads .PKGINFO (pkgname/pkgver/arch/deps) instead
          # of filename prefix, so performance-manager and performance-manager-rill
          # can never be confused and a stale rc.3 artifact can never pass.
          # $SDKDIR is a RELATIVE path, so after `cd "$SDKDIR"` above it would
          # resolve to a nested, non-existing directory and rglob would find
          # nothing. Pass the absolute CWD ($PWD), which is the SDK root.
          # OpenWrt 25.x APKs are zstd-compressed; Python's tarfile cannot read
          # zstd, so verify_apks.py needs the zstandard module.
          python3 -m pip install --disable-pip-version-check zstandard
          python3 "$GITHUB_WORKSPACE/scripts/verify_apks.py" "$PWD" "$apk_version" "$PACKAGE_ARCH"
      - name: Generate build metadata (auditable evidence)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check jsonschema pyyaml
          # Blocking source audit: a failing audit must fail this workflow; the
          # `|| true` swallower is deliberately removed.
          make audit
          python3 scripts/build_evidence.py
          cat build-metadata.json
      - name: Generate package checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDKDIR"
          find bin -name '*.apk' -o -name '*.ipk' | sort | xargs -r sha256sum > "$GITHUB_WORKSPACE/checksums.txt"
          cd "$GITHUB_WORKSPACE"
          cat checksums.txt
      - name: Generate Rill consumed manifest
        run: python scripts/generate_rill_consumed_manifest.py --out rill-consumed-manifest.json
      - name: Stage exact all-in-one prerelease asset
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/stage_all_in_one_release.py \
            --sdk-dir "$SDKDIR" \
            --verification docs/apk-verification.json \
            --out all-in-one-release
      - name: Upload exact all-in-one prerelease asset
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-${{ env.SDK_CACHE_TAG }}-all-in-one-apk
          path: all-in-one-release/
          if-no-files-found: error
      - name: Upload package artifacts and build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-${{ env.SDK_CACHE_TAG }}-packages-and-evidence
          path: |
            ${{ env.SDKDIR }}/bin/packages/**/*.apk
            ${{ env.SDKDIR }}/bin/packages/**/*.ipk
            ${{ env.SDKDIR }}/bin/targets/**/packages/*.apk
            ${{ env.SDKDIR }}/bin/targets/**/packages/*.ipk
            build-metadata.json
            checksums.txt
            rill-consumed-manifest.json
            docs/FINAL_AUDIT.md
            docs/FINAL_AUDIT.json
            docs/source-audit.json
            docs/SOURCE_GATES.json
            docs/HOST_SYNTAX_REPORT.json
            docs/RESOURCE_BUDGET.json
            docs/rill-integration-status.json
            docs/apk-verification.json
          if-no-files-found: error

  # Final build evidence aggregation (rc.7 prompt 29/43): gates this workflow on
  # the SDK/APK chain ONLY (--scope build) — build-metadata.json verdicts +
  # the exact apk-verification.json report, both tied to the same PM commit.
  # The Rill runtime/functional chain is owned by the ci.yml workflow's own
  # aggregator job, so neither workflow can falsely PASS what the other alone
  # can prove.  A broken same-commit chain or any non-PASS verdict fails closed.
  final-release-evidence:
    runs-on: ubuntu-latest
    needs: openwrt-sdk-build
    steps:
      - uses: actions/checkout@v7
      - name: Download all target SDK build evidence
        uses: actions/download-artifact@v8
        with:
          path: evidence
          pattern: openwrt-*-packages-and-evidence
          merge-multiple: false
      - name: Aggregate final build evidence (same-commit SDK/APK chain)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          copy_unique_evidence() {
            local name="$1"
            local required="$2"
            local -a matches=()
            mapfile -t matches < <(find evidence -type f -name "$name" -print)
            if [ "${#matches[@]}" -eq 1 ]; then
              cp "${matches[0]}" "docs/$name"
              return 0
            fi
            if [ "$required" = required ] || [ "${#matches[@]}" -gt 1 ]; then
              echo "Expected exactly one $name, found ${#matches[@]}" >&2
              return 1
            fi
          }
          python3 scripts/aggregate_build_matrix_evidence.py \
            --input evidence --out docs --expected-commit "$GITHUB_SHA" \
            --expected-arch x86_64 --expected-arch aarch64_generic
          python3 scripts/aggregate_final_evidence.py \
            --evidence-dir docs --scope build \
            --expected-commit "$GITHUB_SHA" \
            --out docs/final-release-evidence.json
      - name: Upload final build evidence
        uses: actions/upload-artifact@v7
        with:
          name: final-release-evidence-build
          path: docs/final-release-evidence.json
          if-no-files-found: error
