name: Build OpenWrt (remote SDK)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_VERSION: "25.12.5"   # primary supported baseline (APK)
  OPENWRT_TARGET: "x86/64"

jobs:
  # Official OpenWrt SDK build for the packages this repository OWNS:
  # performance-manager (Core), luci-app-performance-manager (UI) and the
  # performance-manager-rill integration package (which never compiles Rill).
  # Real build evidence comes from this remote Action — never a local mock.
  # Rill is an EXTERNAL dependency: no Rust toolchain/cargo job exists here.
  openwrt-sdk-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential gawk gettext libncurses-dev libssl-dev python3 rsync unzip file wget zstd
      - name: Download official SDK and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}"
          curl -fsSL "$base/" -o /tmp/index.html
          sdk=$(grep -oE "openwrt-sdk-${OPENWRT_VERSION}-x86-64_[^\"< ]+\.tar\.zst" /tmp/index.html | head -n1)
          test -n "$sdk"
          curl -fsSL "$base/sha256sums" -o /tmp/sha256sums
          curl -fsSLO "$base/$sdk"
          grep -e "\\*$sdk$" /tmp/sha256sums | sha256sum -c -
          tar --zstd -xf "$sdk"
          sdkdir=$(find . -maxdepth 1 -type d -name "openwrt-sdk-${OPENWRT_VERSION}-x86-64_*" | head -n1)
          test -n "$sdkdir"
          echo "SDKDIR=$sdkdir" >> "$GITHUB_ENV"
          echo "FEEDS_BUILDINFO_URL=$base/feeds.buildinfo" >> "$GITHUB_ENV"
          echo "SDK_CACHE_TAG=${OPENWRT_VERSION}-${OPENWRT_TARGET//\//-}" >> "$GITHUB_ENV"
      - name: Pin feeds to official release feed commits
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDKDIR"
          ./scripts/feeds update -a
          python3 "$GITHUB_WORKSPACE/scripts/pin_feeds.py"
      - name: Install feeds and local packages
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDKDIR"
          ./scripts/feeds install -a
          mkdir -p package/openwrt-performance-manager
          cp -a "$GITHUB_WORKSPACE"/package/* package/openwrt-performance-manager/
          make defconfig
      - name: Build Core
        run: cd "$SDKDIR" && make -j2 package/performance-manager/compile V=s
      - name: Build LuCI
        run: cd "$SDKDIR" && make -j2 package/luci-app-performance-manager/compile V=s
      - name: Build Rill integration package (glue only, never compiles Rill)
        run: cd "$SDKDIR" && make -j2 package/performance-manager-rill/compile V=s
      - name: Assert expected packages present (exact APK metadata match)
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDKDIR"
          find bin -name '*.apk' -o -name '*.ipk' | sort
          # Version part of the APK pkgver: VERSION is 1.0.0-rc.4 -> 1.0.0_rc4.
          apk_version="$(sed -E 's/-rc\./_rc/' "$GITHUB_WORKSPACE/VERSION")"
          # Exact verification reads .PKGINFO (pkgname/pkgver/arch/deps) instead
          # of filename prefix, so performance-manager and performance-manager-rill
          # can never be confused and a stale rc.3 artifact can never pass.
          python3 "$GITHUB_WORKSPACE/scripts/verify_apks.py" "$SDKDIR" "$apk_version" "x86_64"
      - name: Generate build metadata (auditable evidence)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check jsonschema pyyaml
          # Blocking source audit: a failing audit must fail this workflow; the
          # `|| true` swallower is deliberately removed.
          make audit
          python3 scripts/build_evidence.py
          cat build-metadata.json
      - name: Generate package checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDKDIR"
          find bin -name '*.apk' -o -name '*.ipk' | sort | xargs -r sha256sum > "$GITHUB_WORKSPACE/checksums.txt"
          cd "$GITHUB_WORKSPACE"
          cat checksums.txt
      - name: Generate Rill consumed manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_WORKSPACE" <<'PY'
          import json, sys
          root = sys.argv[1]
          dep = json.load(open(f"{root}/contracts/rill-dependency.json"))
          up = dep.get("upstream") or {}
          manifest = {
            "schemaVersion": 1,
            "contract": "pm<->rill-consumed-release",
            "upstreamRepository": up.get("repository"),
            "consumedVersion": up.get("releaseVersion"),
            "artifactUrl": up.get("artifactUrl"),
            "artifactSha256": up.get("artifactSha256"),
            "manifestUrl": up.get("manifestUrl"),
            "status": up.get("status") or "external-dependency-blocked",
            "blockedReason": up.get("blockedReason"),
            "protocolApi": dep.get("protocol", {}).get("api"),
            "requiredCapabilities": dep.get("capabilities", {}).get("required"),
            "minimumRillVersion": dep.get("minimumRillVersion"),
            "note": "PM never compiles Rill; this manifest records the upstream release this repo consumes. When null the integration is external-dependency-blocked and the Core capability gate fails closed."
          }
          with open(f"{root}/rill-consumed-manifest.json", "w") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(json.dumps({"status": manifest["status"], "consumedVersion": manifest["consumedVersion"]}))
          PY
      - name: Upload package artifacts and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openwrt-${{ env.SDK_CACHE_TAG }}-packages-and-evidence
          path: |
            ${{ env.SDKDIR }}/bin/packages/**/*.apk
            ${{ env.SDKDIR }}/bin/packages/**/*.ipk
            ${{ env.SDKDIR }}/bin/targets/**/packages/*.apk
            ${{ env.SDKDIR }}/bin/targets/**/packages/*.ipk
            build-metadata.json
            checksums.txt
            rill-consumed-manifest.json
            docs/FINAL_AUDIT.md
            docs/FINAL_AUDIT.json
            docs/SOURCE_GATES.json
            docs/HOST_SYNTAX_REPORT.json
            docs/RESOURCE_BUDGET.json
            docs/rill-integration-status.json
            docs/apk-verification.json
          if-no-files-found: error